<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Numeris board</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/picker.css">
</head>
<body>

<header id="bar">
  <div id="where"></div>
  <div id="track" aria-hidden="true"><div id="track-fill"></div></div>
  <div id="count"></div>
</header>

<main id="screen" tabindex="-1"></main>

<nav id="move">
  <button id="prev" type="button" aria-label="Previous screen">←</button>
  <button id="next" type="button" aria-label="Next screen">Next →</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/picker.js"></script>
</body>
</html>
