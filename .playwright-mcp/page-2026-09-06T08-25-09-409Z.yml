          - text: which is a part of these Terms and contains provisions applicable to the use of personal data.
        - heading "19. Governing law" [level=2] [ref=f66e216]
        - paragraph [ref=f66e218]: These Terms are subject to English law and to the exclusive jurisdiction of the English courts.
