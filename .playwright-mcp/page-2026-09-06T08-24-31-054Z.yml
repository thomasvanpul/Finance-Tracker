          - heading "Data & Index Licensing" [level=1] [ref=f41e88]
          - paragraph [ref=f41e89]: Whether used as the foundation of a custom-built financial instrument, to uncover specific market trends, or to gain a better understanding of the markets in general, licensing indices and associated data packages from S&P Dow Jones Indices (S&P DJI) can be invaluable to a range of financial professionals.
          - generic:
            - list
        - generic [ref=f41e91]:
          - heading "Index Licensing" [level=2] [ref=f41e93]
          - generic [ref=f41e94]:
            - paragraph [ref=f41e95]: "S&P DJI licenses indices to more than 550 financial institutions worldwide to build investment products linked to our indices, including:"
            - generic [ref=f41e96]:
              - list [ref=f41e98]:
                - listitem [ref=f41e99]:
                  - paragraph [ref=f41e104]:
                    - strong [ref=f41e105]: Exchange-Traded Funds (ETFs)
                - listitem [ref=f41e106]:
                  - paragraph [ref=f41e111]:
                    - strong [ref=f41e112]: Mutual Funds
                - listitem [ref=f41e113]:
                  - paragraph [ref=f41e118]:
                    - strong [ref=f41e119]: Futures and Options
                - listitem [ref=f41e120]:
                  - paragraph [ref=f41e125]:
                    - strong [ref=f41e126]: Structured Products
                - listitem [ref=f41e127]:
                  - paragraph [ref=f41e132]:
                    - strong [ref=f41e133]: Annuities and Insurance Products
              - paragraph [ref=f41e134]: A license with S&P DJI gives an organization the data and permissions needed to replicate the performance of one or more of our indices in their investment products. Licensees are also able to leverage our world-renowned brand to promote their products.
        - separator [ref=f41e135]
        - generic [ref=f41e137]:
          - heading "Data and Benchmarking" [level=2] [ref=f41e139]
          - generic [ref=f41e140]:
            - paragraph [ref=f41e141]: S&P DJI index data packages can be invaluable tools for asset managers, investment banks, and others to measure, track, and analyze the global markets.
            - paragraph [ref=f41e142]: "A range of flexible index data subscriptions—from broad to extremely detailed—are available to suit specific needs and desired outcomes. Packages can be tailored by geography, sector, style, and/or index family. Packages are offered at three levels: index, constituent data, and/or corporate action information."
            - generic [ref=f41e143]:
              - generic [ref=f41e144]:
                - paragraph [ref=f41e145]:
                  - strong [ref=f41e146]: "Applications include:"
