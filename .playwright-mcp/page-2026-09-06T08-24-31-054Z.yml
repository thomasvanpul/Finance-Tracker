                  - listitem [ref=f41e156]:
                    - generic [ref=f41e160]:
                      - paragraph [ref=f41e161]:
                        - strong [ref=f41e162]: Portfolios
                      - paragraph [ref=f41e163]: Modeling portfolios and supporting asset allocation decisions
                  - listitem [ref=f41e164]:
