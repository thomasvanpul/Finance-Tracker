<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Map, phone home</title>
<link rel="stylesheet" href="map.css">
<style>
  body { width: 390px; height: 844px; overflow: hidden; position: relative; }
  .safe { height: 47px; }
  .read { padding: 10px 14px 12px; }
  .read .nw { font-family: var(--mono); font-size: 38px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
  .read .nw .p { color: var(--faint); }
  .read .sub { display: flex; gap: 10px; align-items: baseline; margin-top: 7px; font-size: 12.5px; color: var(--dim); font-stretch: 90%; }
  .read .sub .pnum { font-size: 13px; }
  #map { margin: 0 0; }
  .debt { display: flex; align-items: center; gap: 8px; margin-top: 4px; padding: 0 2px; }
  .debt .bar { flex: none; }
  .debt .l { font-size: 11px; color: var(--dim); font-stretch: 85%; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .debt .pnum { font-size: 11.5px; color: var(--neg); padding-right: 12px; }
  .hz { padding: 16px 14px 0; }
  .hz .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .hz .h .pnum { font-size: 12.5px; }
  .hz .h .k { font-size: 11px; color: var(--dim); font-stretch: 85%; margin-left: 5px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 0 14px 30px; display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); background: var(--bg); }
  .tab { flex: 1 1 auto; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; font-stretch: 72%; letter-spacing: 0.05em; color: var(--faint); }
  .tab.on { color: var(--text); }
  .tab.on span { border-bottom: 2px solid var(--accent); padding-bottom: 3px; }
  .log { width: 50px; height: 50px; margin-left: 8px; border-radius: 4px; background: var(--accent); color: #062a2e; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 26px; font-weight: 400; }
</style>
</head>
<body>
<div class="safe"></div>
<div class="read">
  <div class="nw" id="nw"></div>
  <div class="sub"><span class="pnum up" id="chg"></span><span id="chgd"></span></div>
</div>
<div class="map" id="map"></div>
<div class="debt" id="debt"></div>
<div class="hz">
  <div class="h"><span><span class="pnum" style="color:var(--warn)" id="late"></span><span class="k" id="latek"></span></span><span><span class="pnum" id="free"></span><span class="k">a day</span></span></div>
  <div id="hz"></div>
</div>
<nav class="dock">
  <div class="tab on"><span>HOME</span></div><div class="tab">WORTH</div><div class="tab">SPENDING</div><div class="tab">UPCOMING</div><div class="tab">DIRECTORY</div>
  <div class="log">+</div>
</nav>
<script src="../data.js"></script>
<script src="../lib.js"></script>
<script src="map.js"></script>
<script src="horizon.js"></script>
<script>
  const { money, dayLabel, dash, attrib, alloc, pastDue, sum, accounts, owing } = N;
  const s = money(dash.netWorth), d = s.lastIndexOf(".");
  document.getElementById("nw").innerHTML = s.slice(0, d) + `<span class="p">${s.slice(d)}</span>`;
  document.getElementById("chg").innerHTML = money(attrib.totalDeltaBase, "GBP", { signed: true }) + '<span class="fx">fx</span>';
  document.getElementById("chgd").textContent = "since " + dayLabel(attrib.periodFrom) + ", all exchange rate";
  const M = WorthMap.render(document.getElementById("map"), 390, 452, { maxName: 34, maxVal: 15 });
  // liabilities on the same px-per-pound scale as the map, as a full-width band
  const debts = [...accounts.filter((a) => a.type === "liability").map((a) => ({ n: a.name, v: a.baseEquivalent })),
                 ...owing.filter((o) => o.direction === "i_owe_them" && o.status === "pending").map((o) => ({ n: o.personName, v: o.baseEquivalent }))];
  const dv = sum(debts, (x) => x.v);
  const bandW = 150, bandH = (dv * M.pxPerPound) / bandW;
  document.getElementById("debt").innerHTML = `<div class="bar hatch-neg" style="width:${bandW}px;height:${bandH.toFixed(1)}px"></div>
    <span class="l">${debts.map((x) => x.n).join(", ")}</span><span class="pnum">${money(-dv)}</span>`;
  document.getElementById("late").textContent = money(sum(pastDue, (u) => u.baseEquivalent));
  document.getElementById("latek").textContent = `${pastDue.length} unpaid`;
  document.getElementById("free").textContent = money(alloc.dailyAllowance);
  document.getElementById("hz").innerHTML = Horizon(362, 70);
</script>
</body>
</html>
