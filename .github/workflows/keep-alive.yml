# RE-ENABLED 2026-09-21 as an EXPERIMENTAL SECONDARY pinger — read this
# whole comment before trusting it, because this exact mechanism has
# already failed once.
#
# ── Why this is back on a schedule ───────────────────────────────────────
# Healthchecks.io fired DOWN/UP five times overnight 2026-09-20/21
# (episodes of 8m54s, 1h34m, 39m54s, 41m22s, 1h23m — real outages, not
# cold-start blips: numeris-api's own boot log shows SEVEN fresh
# "Server listening" events between 18:00 and 09:00 — 19:19, 21:15,
# 03:04, 03:38, 05:37, 06:44, 07:50 — with gaps up to 5h49m between
# them. A 1-minute external ping landing successfully makes a 15-minute
# idle spin-down impossible, so the documented primary pinger
# (cron-job.org, see docs/OPERATIONS.md § "Uptime pinger and
# dead-man's-switch") was not reaching the instance that night. Its
# account could not be inspected from this session (no stored login),
# so its actual state — paused, misconfigured, deleted — is still
# unconfirmed. Fixing THAT is the real fix. This workflow is a stopgap
# underneath it, not a replacement for checking it.
#
# ── Why re-enabling this specific mechanism is a real risk, not a formality ──
# Between 2026-08-26 and 2026-09-01 this exact schedule (10-minute cron)
# was measured firing a median of once every 260 minutes, worst gap 737
# minutes, and ALL 29 measured gaps exceeded Render's 15-minute idle
# threshold — i.e. it never once actually kept the instance warm
# (measurement: `gh run list --workflow=keep-alive.yml`). GitHub's
# scheduled-workflow queue delay under load is the suspected cause and
# there is no reason to assume it has improved. Before trusting this
# again, MEASURE: `gh run list --workflow=keep-alive.yml --limit 30`
# after it has had 24h+ to run, and compare each run's queued-vs-started
# time against the 10-minute schedule. If the drift reproduces, this
# workflow is decorative again and the fix has to be cron-job.org itself
# (or paying for Render Starter — no sleep, $7/mo, see
# docs/OPERATIONS.md § "Upgrade signal").
#
# ── RE-MEASURED 2026-10-01: the drift reproduced, this is decorative ────
# `gh run list --workflow=keep-alive.yml --limit 100`, runs after the
# 2026-09-21 re-enable only: 57 scheduled runs from 2026-09-21 16:01Z to
# 2026-10-01 07:43Z (9.6 days; a 10-minute cron would have fired ~1,390
# times). 56 gaps: median 250 min, p90 349 min, min 124, max 500. Gaps at
# or under Render's 15-minute idle threshold: 0 of 56. All 57 succeeded,
# so the run itself is fine; GitHub simply does not schedule it anywhere
# near every 10 minutes. It keeps nothing warm. The fix is cron-job.org
# (or Render Starter) as stated above, not this file.
#
# ── SCHEDULE REMOVED 2026-10-03: nothing left for it to do ──────────────
# numeris-api moved to Render Starter ($7/mo, no idle sleep) on 2026-09-22,
# so there is no spin-down to defeat. The run logs agree: of the 65
# scheduled runs since the re-enable, the five before 2026-09-22 06:46Z
# took 22.6-42.8 s (cold boots) and all 60 after took 0.19-1.00 s. Kept as
# workflow_dispatch only, as the record of this failure and a manual probe.
# cron-job.org is NOT retired with it: /api/healthz is what pings
# Healthchecks.io (routes/health.ts), so the external 1-minute hit is what
# feeds the dead-man's switch. See docs/OPERATIONS.md.
#
# ── Cost ──────────────────────────────────────────────────────────────────
# thomasvanpul/Finance-Tracker is a public repo, so Actions minutes are
# free/unlimited regardless of run count. The cost that DOES apply is
# Render's own free-tier ceiling: pinging every 10 minutes keeps the
# instance awake close to continuously, i.e. close to 720-744 of the
# 750 free instance-hours/month this single service is allowed — right
# up against the cap with almost no headroom, not free in the sense of
# "no consequence."
#
# ── Failure-visibility layer, unchanged ──────────────────────────────────
# Healthchecks.io dead-man's-switch still covers "cron-job.org broke",
# "this workflow broke", and everything else per docs/OPERATIONS.md.
# Its grace/period tuning was not touched here — no stored login for
# that dashboard either.

name: keep-alive-render (manual only — schedule removed 2026-10-03, Render Starter has no sleep)

on:
  workflow_dispatch:

concurrency:
  group: keep-alive-render
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/healthz
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_HEALTH_URL:-}" ]]; then
            echo "::error::RENDER_HEALTH_URL secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          curl -sSf --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused \
               -o /dev/null -w "HTTP %{http_code} · total %{time_total}s\n" \
               "$RENDER_HEALTH_URL"
