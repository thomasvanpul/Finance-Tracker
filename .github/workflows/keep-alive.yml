# DEPRECATED — this workflow no longer keeps Render warm.
#
# Between 2026-08-26 and 2026-09-01 GitHub Actions fired this schedule
# a median of once every 260 minutes against a 10-minute cron, with the
# worst gap 737 minutes and every single one of the 29 measured gaps
# exceeding Render's 15-minute idle threshold (measurement:
# `gh run list --workflow=keep-alive.yml`). The mitigation was
# decorative — Render slept between every gap, and the next visitor
# paid a 30–60s cold-start every time.
#
# The header comment on the original file predicted "5-15 min drift
# under load" but nobody ever measured what actually ran. The same
# failure class as a lock that passes while broken.
#
# ── Current arrangement ──────────────────────────────────────────────────
# Primary keep-alive is cron-job.org (1-minute interval, free,
# commercial-safe per ToS). Signup and monitor URL are documented in
# docs/OPERATIONS.md § "Uptime pinger and dead-man's-switch".
#
# Failure-visibility layer is a Healthchecks.io dead-man's-switch. The
# api-server's /api/healthz handler POSTs to HEALTHCHECKS_PING_URL on
# every request; Healthchecks alerts if no heartbeat arrives inside the
# check's expected window. This catches "cron-job.org itself broke" and
# every related silent-failure mode that this GitHub Actions workflow
# didn't.
#
# ── Why the file is still here ───────────────────────────────────────────
# So that a future maintainer with the same idea finds the evidence
# in-repo before implementing it again. Do not credit this file with
# keeping Render warm. Do not re-enable it as primary. If you decide
# GitHub Actions cron has improved, MEASURE first with
# `gh run list --workflow=keep-alive.yml --limit 30` and confirm the
# actual gap distribution before pointing anything at it.
#
# Left disabled below: no `schedule:` trigger, so it never runs on its
# own. Kept only as a manually-triggerable escape hatch for the
# operator who wants to warm Render exactly once after a deploy or a
# provider swap.

name: keep-alive-render (DEPRECATED — manual trigger only)

on:
  # No schedule. See header above.
  workflow_dispatch:

concurrency:
  group: keep-alive-render
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/healthz (manual)
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_HEALTH_URL:-}" ]]; then
            echo "::error::RENDER_HEALTH_URL secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          curl -sSf --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused \
               -o /dev/null -w "HTTP %{http_code} · total %{time_total}s\n" \
               "$RENDER_HEALTH_URL"
