# Keep-alive ping to Render so the free-tier service does not idle-sleep.
#
# ── Instance-hours arithmetic — do NOT "optimise" this cron away ────────────
# Render's free web service ceiling is 750 instance-hours per calendar month.
# A 31-day month running 24/7 uses 24 * 31 = 744 hours. That leaves 6 hours of
# headroom — enough to survive a deploy or two but not enough to justify
# running a second warm instance. Any month with 30 days or fewer stays well
# below the ceiling.
#
# Instance hours measure UPTIME, not traffic. This works identically at 1
# user or 100,000; keep-alive costs nothing in $ and the incremental req is
# rounding-error compared to normal traffic. The signal to leave the free
# tier is latency-under-load, not this counter (see docs/PLAN-Q3.md Phase 0.1
# and Appendix A).
#
# The pinger CANNOT live on the service itself — a sleeping instance cannot
# wake itself. It must run externally, which is why this is a GitHub
# Actions cron and not a node-cron inside api-server.
#
# ── GitHub cron caveat ──────────────────────────────────────────────────────
# GitHub does not guarantee cron precision, especially on free plans; a
# scheduled workflow can be delayed by 5–15 minutes under load. Ten-minute
# cadence gives ~15 min effective ceiling in the worst case, which is still
# well inside Render's 15-min idle threshold. If cold starts return, the
# first thing to check is Actions run history — a skipped or delayed run
# will show up there.

name: keep-alive-render

on:
  schedule:
    # Every 10 minutes. Cron uses UTC.
    - cron: "*/10 * * * *"
  # Manual trigger for post-deploy verification.
  workflow_dispatch:

# Only one keep-alive run at a time. If a previous run is still pinging
# (network stall), skip rather than pile up.
concurrency:
  group: keep-alive-render
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/healthz
        env:
          # Repo secret. Full URL to /api/healthz on the Render service,
          # e.g. https://numeris-api.onrender.com/api/healthz. Kept in
          # secrets rather than hardcoded so the workflow keeps working
          # if the service is redeployed to a new URL.
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_HEALTH_URL:-}" ]]; then
            echo "::error::RENDER_HEALTH_URL secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          # -sSf: silent progress, still show errors, fail on 4xx/5xx.
          # --max-time 60: a cold start takes ~50s, so 60s covers the
          # first-ping-after-sleep case that this cron exists to prevent.
          # Retries: on transient network hiccups only, not on HTTP errors.
          curl -sSf --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused \
               -o /dev/null -w "HTTP %{http_code} · total %{time_total}s\n" \
               "$RENDER_HEALTH_URL"
