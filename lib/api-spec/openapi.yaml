openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Personal Finance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: accounts
  - name: transactions
  - name: upcoming
  - name: investments
  - name: dashboard
  - name: market
  - name: wise
  - name: import
  - name: settings
  - name: debts
  - name: budgets
  - name: goals
  - name: subscriptions
  - name: connections

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get full dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── ACCOUNTS ───────────────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── TRANSACTIONS ───────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with optional filters
      parameters:
        - name: accountId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [income, expense, transfer, null]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Monthly transaction summary
      parameters:
        - name: month
          in: query
          schema:
            type: ["string", "null"]
          description: YYYY-MM, defaults to current month
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"

  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── UPCOMING ───────────────────────────────────────────────────────────────
  /upcoming:
    get:
      operationId: listUpcoming
      tags: [upcoming]
      summary: List upcoming scheduled items
      responses:
        "200":
          description: List of upcoming items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingItem"
    post:
      operationId: createUpcomingItem
      tags: [upcoming]
      summary: Create an upcoming item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpcomingItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"

  /upcoming/summary:
    get:
      operationId: getUpcomingSummary
      tags: [upcoming]
      summary: 30-day committed outgoings and expected income
      responses:
        "200":
          description: Upcoming summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingSummary"

  /upcoming/installments:
    post:
      operationId: generateInstallments
      tags: [upcoming]
      summary: Generate monthly installment rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallmentInput"
      responses:
        "201":
          description: Created installments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingItem"

  /upcoming/{id}:
    patch:
      operationId: updateUpcomingItem
      tags: [upcoming]
      summary: Update an upcoming item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpcomingItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"
    delete:
      operationId: deleteUpcomingItem
      tags: [upcoming]
      summary: Delete an upcoming item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /upcoming/{id}/pay:
    post:
      operationId: payUpcomingItem
      tags: [upcoming]
      summary: Mark item as paid and auto-log to transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paid and transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"

  # ── INVESTMENTS ────────────────────────────────────────────────────────────
  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      summary: List investment positions with live prices
      responses:
        "200":
          description: Investment positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
    post:
      operationId: createInvestment
      tags: [investments]
      summary: Add an investment position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/summary:
    get:
      operationId: getInvestmentSummary
      tags: [investments]
      summary: Portfolio totals
      responses:
        "200":
          description: Investment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentSummary"

  /investments/{id}:
    patch:
      operationId: updateInvestment
      tags: [investments]
      summary: Update an investment position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
    delete:
      operationId: deleteInvestment
      tags: [investments]
      summary: Delete an investment position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DEBTS / OWING ──────────────────────────────────────────────────────────
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: List all debt entries
      responses:
        "200":
          description: List of debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"
    post:
      operationId: createDebt
      tags: [debts]
      summary: Create a debt entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/summary:
    get:
      operationId: getDebtSummary
      tags: [debts]
      summary: Get debt totals summary
      responses:
        "200":
          description: Debt summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtSummary"

  /debts/{id}:
    patch:
      operationId: updateDebt
      tags: [debts]
      summary: Update a debt entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
    delete:
      operationId: deleteDebt
      tags: [debts]
      summary: Delete a debt entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /debts/{id}/settle:
    post:
      operationId: settleDebt
      tags: [debts]
      summary: Mark a debt as settled
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  # ── MARKET DATA ────────────────────────────────────────────────────────────
  /market/fx-rates:
    get:
      operationId: getFxRates
      tags: [market]
      summary: Get live FX rates (GBP base)
      responses:
        "200":
          description: FX rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"

  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Get live stock prices for given tickers
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols
      responses:
        "200":
          description: Stock prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockPrice"

  /market/quotes:
    get:
      operationId: getMarketQuotes
      tags: [market]
      summary: Get rich fundamental data for given tickers
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols
      responses:
        "200":
          description: Stock quotes with fundamental data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockQuote"

  # ── WISE ───────────────────────────────────────────────────────────────────
  /wise/status:
    get:
      operationId: getWiseStatus
      tags: [wise]
      summary: Check whether a Wise personal API token is configured and valid
      responses:
        "200":
          description: Wise connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiseStatus"

  /wise/sync:
    post:
      operationId: syncWiseTransactions
      tags: [wise]
      summary: Sync balances and transactions from Wise using the configured personal API token
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiseSyncResult"

  # ── CONNECTIONS ───────────────────────────────────────────────────────────
  # Per-user provider connections. Credentials are encrypted at rest and
  # NEVER appear in a response body — see docs/CREDENTIAL-ENCRYPTION.md.
  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List the current user's connections. Credentials are never returned.
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a connection. Adapter validates the credential before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionInput"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: Invalid input or the provider rejected the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{id}:
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection. Also deletes the encrypted credential.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{id}/sync:
    post:
      operationId: syncConnection
      tags: [connections]
      summary: Run the provider sync for this connection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSyncResult"
        "400":
          description: Adapter reported a typed failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSyncFailure"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── IMPORT (CSV) ─────────────────────────────────────────────────────────────
  /import/csv:
    post:
      operationId: importCsv
      tags: [import]
      summary: Import transactions from a bank-exported CSV file (Revolut or Maybank)
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [revolut, maybank, monzo, hsbc, wise, chase]
        - name: accountId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportCsvInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  # ── BUDGETS ────────────────────────────────────────────────────────────────
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List all budgets for the current user
      responses:
        "200":
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      operationId: createBudget
      tags: [budgets]
      summary: Create a new budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetBody"
      responses:
        "201":
          description: Created budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"

  /budgets/{id}:
    put:
      operationId: updateBudget
      tags: [budgets]
      summary: Update a budget's monthly limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetBody"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    delete:
      operationId: deleteBudget
      tags: [budgets]
      summary: Delete a budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  # ── GOALS ─────────────────────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all savings goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /goals/{id}/add-funds:
    post:
      operationId: addGoalFunds
      tags: [goals]
      summary: Add funds to a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/dismissed:
    get:
      operationId: listDismissedSubscriptions
      tags: [subscriptions]
      summary: List dismissed subscription candidates
      responses:
        "200":
          description: List of dismissed descriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: dismissSubscription
      tags: [subscriptions]
      summary: Dismiss a detected subscription candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
      responses:
        "201":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /subscriptions/{id}:
    put:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  # ── EXPORT ────────────────────────────────────────────────────────────────
  /export/backup:
    get:
      operationId: downloadBackup
      tags: [settings]
      summary: Download full data backup as JSON
      responses:
        "200":
          description: JSON backup file
          content:
            application/json:
              schema:
                type: object

  # ── SETTINGS (currency) ────────────────────────────────────────────────────
  /settings/currency:
    get:
      operationId: getSettingsCurrency
      tags: [settings]
      summary: Get the current base currency
      responses:
        "200":
          description: Base currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
    put:
      operationId: updateSettingsCurrency
      tags: [settings]
      summary: Update the base currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencySettings"
      responses:
        "200":
          description: Updated

  /settings/persona:
    get:
      operationId: getSettingsPersona
      tags: [settings]
      summary: Get the current user's persona
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaSettings"
    put:
      operationId: updateSettingsPersona
      tags: [settings]
      summary: Set the current user's persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaSettings"
      responses:
        "200":
          description: Updated

  /settings/theme:
    get:
      operationId: getSettingsTheme
      tags: [settings]
      summary: Get the current user's theme
      responses:
        "200":
          description: Theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSettings"
    put:
      operationId: updateSettingsTheme
      tags: [settings]
      summary: Set the current user's theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeSettings"
      responses:
        "200":
          description: Updated

  # ── SETTINGS (password + 2FA) ───────────────────────────────────────────────
  /settings/password:
    post:
      operationId: changePassword
      tags: [settings]
      summary: Change the app password (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /settings/2fa/status:
    get:
      operationId: get2faStatus
      tags: [settings]
      summary: Whether TOTP 2FA is currently enabled
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaStatus"

  /settings/2fa/setup:
    post:
      operationId: setup2fa
      tags: [settings]
      summary: Begin 2FA setup — generates a new TOTP secret and QR code (not yet enabled)
      responses:
        "200":
          description: Setup data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaSetupResult"

  /settings/2fa/confirm:
    post:
      operationId: confirm2fa
      tags: [settings]
      summary: Confirm 2FA setup with a code from the authenticator app — enables 2FA and returns backup codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFaConfirmInput"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaConfirmResult"

  /settings/2fa/disable:
    post:
      operationId: disable2fa
      tags: [settings]
      summary: Disable 2FA (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTwoFaInput"
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Connection:
      type: object
      required: [id, provider, label, status, createdAt]
      description: |
        Per-user provider connection. Credentials are encrypted at rest and
        MUST NEVER appear on this shape or on any shape returned by a
        connection endpoint. If you add a field here, verify no test in
        connections.test.ts fires because you leaked a secret.
      properties:
        id:
          type: integer
        provider:
          type: string
          description: Provider slug (e.g. "wise")
        label:
          type: string
        status:
          type: string
          enum: [pending, active, error, revoked]
        lastSyncedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateConnectionInput:
      type: object
      required: [provider, credential]
      properties:
        provider:
          type: string
          description: Provider slug (e.g. "wise")
        credential:
          type: string
          description: |
            The provider secret. Sent once at connection time, encrypted
            immediately, and never returned. Do NOT log or echo.
        label:
          type: string
          description: Optional user-supplied label. If omitted, the adapter suggests one.

    ConnectionSyncResult:
      type: object
      required: [connectionId, accountsUpserted, transactionsAdded, transactionsUpdated]
      properties:
        connectionId:
          type: integer
        accountsUpserted:
          type: integer
        transactionsAdded:
          type: integer
        transactionsUpdated:
          type: integer

    ConnectionSyncFailure:
      type: object
      required: [error, kind]
      properties:
        error:
          type: string
        kind:
          type: string
          enum: [auth, rate_limit, network, provider, invalid_response]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── ACCOUNT ──────────────────────────────────────────────────────────────
    Account:
      type: object
      required: [id, name, currency, balance, baseEquivalent, type, isWiseLinked, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        # Nullable: toBase returns null when the FX rate for this
        # account's currency is unavailable. Consumers render the native
        # amount alone (never a fabricated base-currency zero or a bare dash where a native figure
        # exists).
        baseEquivalent:
          type: ["number", "null"]
        type:
          type: string
          enum: [cash, investment, pension, property, other]
        isWiseLinked:
          type: boolean
        wiseProfileId:
          type: ["string", "null"]
        wiseBalanceId:
          type: ["string", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    AccountInput:
      type: object
      required: [name, currency, balance]
      properties:
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        type:
          type: string
          enum: [cash, investment, pension, property, other]

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        type:
          type: string
          enum: [cash, investment, pension, property, other]

    # ── TRANSACTION ──────────────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, date, description, type, category, accountId, accountName, nativeAmount, currency, baseEquivalent, source, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        accountName:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
        # Nullable: null when the transaction's FX rate is unavailable.
        # Sign follows the transaction type (expense = negative). Rows
        # render the native amount alone (never a fabricated base-currency zero or a bare dash).
        # Value is in the USER'S BASE CURRENCY, not literal GBP — the
        # name was renamed from gbpValue on 30 Aug 2026 to remove the
        # split contract lie (accounts/upcoming/debts were already
        # baseEquivalent; transactions and investments were gbpValue).
        baseEquivalent:
          type: ["number", "null"]
        source:
          type: string
          enum: [manual, wise, csv]
        externalId:
          type: ["string", "null"]
        createdAt:
          type: string

    TransactionInput:
      type: object
      required: [date, description, type, category, accountId, nativeAmount, currency]
      properties:
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        nativeAmount:
          type: number
        currency:
          type: string

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        nativeAmount:
          type: number
        currency:
          type: string

    TransactionSummary:
      type: object
      required: [month, totalIncome, totalExpenses, netSavings, savingsRate]
      properties:
        month:
          type: string
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netSavings:
          type: number
        savingsRate:
          type: number

    # ── UPCOMING ─────────────────────────────────────────────────────────────
    UpcomingItem:
      type: object
      required: [id, dueDate, description, category, type, frequency, status, nativeAmount, currency, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        status:
          type: string
          enum: [pending, paid, skipped]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        # Nullable: null when FX for this upcoming item's currency is
        # unavailable. Rows render the native amount alone.
        baseEquivalent:
          type: ["number", "null"]
        accountId:
          type: ["integer", "null"]
        accountName:
          type: ["string", "null"]
        createdAt:
          type: string

    UpcomingItemInput:
      type: object
      required: [dueDate, description, category, type, frequency, nativeAmount, currency]
      properties:
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        accountId:
          type: ["integer", "null"]

    UpcomingItemUpdate:
      type: object
      properties:
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        status:
          type: string
          enum: [pending, paid, skipped]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        accountId:
          type: ["integer", "null"]

    UpcomingSummary:
      type: object
      required: [committedOutgoings30d, expectedIncome30d]
      properties:
        committedOutgoings30d:
          type: number
        expectedIncome30d:
          type: number

    InstallmentInput:
      type: object
      required: [description, category, totalAmount, currency, numberOfMonths, startDate]
      properties:
        description:
          type: string
        category:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        numberOfMonths:
          type: integer
        startDate:
          type: string
        accountId:
          type: ["integer", "null"]

    # ── INVESTMENTS ──────────────────────────────────────────────────────────
    Investment:
      type: object
      # priceAvailable is the honesty flag: when the market API cannot supply
      # a live price for a ticker (rate limit, outage, unknown symbol), all
      # price-derived fields (livePrice, currentValue, plBase, plPercent,
      # baseEquivalent) come back as null. Consumers MUST render "—" or a skeleton
      # rather than substituting zero — a fabricated 0 renders as −100.00%
      # against the cost basis, which is the G10 defect this contract fixes.
      # baseEquivalent and plBase are ALSO null when the FX pivot to the
      # user's base currency fails (30 Aug 2026: previously these were
      # named gbpValue/plGbp and computed against literal GBP regardless
      # of the user's base — see enrich-investment.ts for the fix note).
      required: [id, ticker, name, buyDate, shares, costPricePerShare, currency, priceAvailable, livePrice, currentValue, plBase, plPercent, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number
        currency:
          type: string
        priceAvailable:
          type: boolean
        livePrice:
          type: [number, "null"]
        currentValue:
          type: [number, "null"]
        plBase:
          type: [number, "null"]
        plPercent:
          type: [number, "null"]
        baseEquivalent:
          type: [number, "null"]
        createdAt:
          type: string

    InvestmentInput:
      type: object
      required: [ticker, name, buyDate, shares, costPricePerShare]
      properties:
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number

    InvestmentUpdate:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number

    InvestmentSummary:
      type: object
      # totals sum ONLY positions with priceAvailable=true. unavailablePositions
      # counts positions whose price the market API could not supply; those are
      # excluded from every total. Consumers should surface the count so the
      # user understands the roll-up is partial.
      required: [totalValueBase, totalPlBase, totalPlPercent, positions, unavailablePositions]
      properties:
        totalValueBase:
          type: number
        totalPlBase:
          type: number
        # Nullable: percentage is undefined when the portfolio's cost
        # basis is zero (no holdings). Rendering "+0.00%" for a user who
        # holds nothing is a fabricated return the data does not support;
        # null signals "no return to compute" so consumers render "—".
        totalPlPercent:
          type: ["number", "null"]
        positions:
          type: integer
        unavailablePositions:
          type: integer

    # ── DEBTS ─────────────────────────────────────────────────────────────────
    Debt:
      type: object
      required: [id, personName, description, date, nativeAmount, currency, direction, status, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        status:
          type: string
          enum: [pending, settled]
        notes:
          type: ["string", "null"]
        accountId:
          type: ["integer", "null"]
        # Nullable: null when the debt's FX rate is unavailable. Rows
        # render the native amount alone.
        baseEquivalent:
          type: ["number", "null"]
        createdAt:
          type: string
        linkedEmail:
          type: ["string", "null"]
        linkedUserId:
          type: ["string", "null"]
        isReceived:
          type: boolean
        sourceDebtId:
          type: ["integer", "null"]

    DebtInput:
      type: object
      required: [personName, description, date, nativeAmount, currency, direction]
      properties:
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        notes:
          type: string
        accountId:
          type: integer
        linkedEmail:
          type: string

    DebtUpdate:
      type: object
      properties:
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        status:
          type: string
          enum: [pending, settled]
        notes:
          type: string
        accountId:
          type: integer

    DebtSummary:
      type: object
      required: [totalOwedToMe, totalIOwe, netBase, pendingCount]
      properties:
        totalOwedToMe:
          type: number
        totalIOwe:
          type: number
        netBase:
          type: number
        pendingCount:
          type: integer

    # ── BUDGETS ──────────────────────────────────────────────────────────────
    Budget:
      type: object
      required: [id, category, monthlyLimit]
      properties:
        id:
          type: integer
        category:
          type: string
        monthlyLimit:
          type: number

    CreateBudgetBody:
      type: object
      required: [category, monthlyLimit]
      properties:
        category:
          type: string
        monthlyLimit:
          type: number
          minimum: 0.01

    UpdateBudgetBody:
      type: object
      required: [monthlyLimit]
      properties:
        monthlyLimit:
          type: number
          minimum: 0.01

    # ── GOALS ────────────────────────────────────────────────────────────────
    GoalHistoryEntry:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
        amount:
          type: number

    Goal:
      type: object
      required: [id, name, target, current, history]
      properties:
        id:
          type: integer
        name:
          type: string
        target:
          type: number
        current:
          type: number
        deadline:
          type: string
        emoji:
          type: string
        color:
          type: string
        image:
          type: string
        monthlyContribution:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    CreateGoalBody:
      type: object
      required: [name, target]
      properties:
        name:
          type: string
        target:
          type: number
          minimum: 0.01
        current:
          type: number
        deadline:
          type: string
        emoji:
          type: string
        color:
          type: string
        image:
          type: string
        monthlyContribution:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    UpdateGoalBody:
      type: object
      properties:
        name:
          type: string
        target:
          type: number
        current:
          type: number
        deadline:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        monthlyContribution:
          type: number
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────
    Subscription:
      type: object
      required: [id, name, amount, currency, frequency, category, startDate, active, manuallyAdded]
      properties:
        id:
          type: integer
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
        manuallyAdded:
          type: boolean

    CreateSubscriptionBody:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
        manuallyAdded:
          type: boolean

    UpdateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
          nullable: true
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
          nullable: true
        manuallyAdded:
          type: boolean

    # ── MARKET DATA ──────────────────────────────────────────────────────────
    FxRates:
      type: object
      required: [base, rates, updatedAt]
      properties:
        base:
          type: string
        rates:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string

    StockPrice:
      type: object
      required: [ticker, price, currency, updatedAt]
      properties:
        ticker:
          type: string
        price:
          type: number
        currency:
          type: string
        updatedAt:
          type: string

    StockQuote:
      type: object
      required: [ticker, price, currency, updatedAt]
      properties:
        ticker:
          type: string
        price:
          type: number
        currency:
          type: string
        updatedAt:
          type: string
        # Change percent vs. the previous close. The server has always
        # returned this from regularMarketChangePercent, but the schema
        # omitted it — zod .parse() then stripped it on the way out,
        # so every consumer read "—" for %-change even when Yahoo had
        # a real value. Added 2026-08-16 so MarketPane on the home
        # screen and the marquee on /investments show real numbers
        # rather than fabricated or absent ones.
        changePercent:
          type: ["number", "null"]
        previousClose:
          type: ["number", "null"]
        dayHigh:
          type: ["number", "null"]
        dayLow:
          type: ["number", "null"]
        volume:
          type: ["number", "null"]
        nextEarningsDate:
          type: ["string", "null"]
        marketState:
          type: ["string", "null"]
        postMarketPrice:
          type: ["number", "null"]
        postMarketChangePercent:
          type: ["number", "null"]
        preMarketPrice:
          type: ["number", "null"]
        preMarketChangePercent:
          type: ["number", "null"]
        pe:
          type: ["number", "null"]
        forwardPe:
          type: ["number", "null"]
        eps:
          type: ["number", "null"]
        high52w:
          type: ["number", "null"]
        low52w:
          type: ["number", "null"]
        marketCap:
          type: ["number", "null"]
        beta:
          type: ["number", "null"]
        dividendYield:
          type: ["number", "null"]
        analystTargetPrice:
          type: ["number", "null"]
        displayName:
          type: ["string", "null"]

    # ── SETTINGS (currency) ──────────────────────────────────────────────────
    CurrencySettings:
      type: object
      required: [baseCurrency]
      properties:
        baseCurrency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]

    PersonaSettings:
      type: object
      required: [persona]
      properties:
        persona:
          type: string
          enum: [market, budget, wealth, social, full]
          description: |
            Which product face the user sees. See lib/persona.ts on the
            frontend for what each id enables/disables.

    ThemeSettings:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [void, phosphor, arctic, parchment, slate, linen, amber, midnight, matrix, synthwave, deep-space, mario, gilded, bloodline]
          description: |
            The user's chosen colour theme. Server owns this so it
            follows the user across devices and never leaks to a
            different user on the same browser. See
            contexts/theme-context.tsx for colour semantics.

    # ── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [baseCurrency, netLiquidity, netWorth, totalCash, unconvertibleAccounts, accountBreakdown, portfolio, thisMonth, owing]
      properties:
        # Count of accounts whose FX rate was unavailable at request time.
        # Their balance is NOT included in totalCash/netWorth/netLiquidity
        # (the server dropped them from the aggregation) so the UI can
        # name the gap ("2 accounts unconverted") rather than silently
        # under-report the total.
        unconvertibleAccounts:
          type: integer
        baseCurrency:
          type: string
        netLiquidity:
          type: number
        netWorth:
          type: number
        totalCash:
          type: number
        accountBreakdown:
          type: array
          items:
            type: object
            required: [id, name, currency, balance, baseEquivalent, type]
            properties:
              id:
                type: integer
              name:
                type: string
              currency:
                type: string
              balance:
                type: number
              baseEquivalent:
                type: ["number", "null"]
              type:
                type: string
                enum: [cash, investment, pension, property, other]
        portfolio:
          type: object
          required: [totalValueBase, totalPlBase, totalPlPercent, dayChangeBase, dayChangePercent]
          properties:
            totalValueBase:
              type: number
            totalPlBase:
              type: number
            # Nullable: undefined when the portfolio has no cost basis
            # (empty portfolio). Same reason as InvestmentSummary above.
            totalPlPercent:
              type: ["number", "null"]
            # Intraday delta = sum over positions of shares * (price - previousClose),
            # converted to base. NULL when ANY contributing position lacks previousClose
            # or its FX leg — a half-computed delta is a lie on the headline that
            # decides whether the market persona has a reason to open the app tomorrow.
            dayChangeBase:
              type: ["number", "null"]
            # Percent = dayChangeBase / sum(previousValueBase). Null when the delta
            # itself is null or previousValue sums to 0.
            dayChangePercent:
              type: ["number", "null"]
        thisMonth:
          type: object
          required: [income, expenses, netSavings, savingsRate]
          properties:
            income:
              type: number
            expenses:
              type: number
            netSavings:
              type: number
            savingsRate:
              type: number
        owing:
          type: object
          required: [totalOwedToMe, totalIOwe, netBase, pendingCount]
          properties:
            totalOwedToMe:
              type: number
            totalIOwe:
              type: number
            netBase:
              type: number
            pendingCount:
              type: integer
            # C2-4: top pending counterparties (up to 3) so the mobile
            # home CLAIMED strip can name names, not just a count.
            # Sourced from legacy debts + F4 shared-expense
            # participants where the current user is either payer or
            # linked participant and the row is still outstanding.
            topPending:
              type: array
              items:
                type: object
                required: [name, amountBase, direction]
                properties:
                  name:
                    type: string
                  amountBase:
                    type: number
                  direction:
                    type: string
                    enum: [they_owe_me, i_owe_them]
        monthlyHistory:
          type: array
          items:
            type: object
            required: [month, income, expenses, netSavings]
            properties:
              month:
                type: string
              # income/expenses/netSavings are NULLABLE, not just optional.
              # A month with one or more unconvertible transactions (an FX
              # rate the market API couldn't supply) emits nulls rather
              # than partial or fabricated totals. Clients MUST render
              # null as "unknown / dotted / —", never as a base-currency zero — such a zero income
              # month reads as "nothing happened" when the reality is
              # "we don't know the true income because we can't convert
              # some of it". Same class of defect as the RM 4,120 → £4,120
              # bug that the dashboard's per-tx skipping used to prevent
              # for individual entries. See dashboard.monthly-fold.test.ts
              # for the exact behaviour.
              income:
                type: number
                nullable: true
              expenses:
                type: number
                nullable: true
              netSavings:
                type: number
                nullable: true
              # C2-1: per-bucket asset composition snapshot for this
              # month. Null when no snapshot exists (see nw_snapshots
              # table — populated lazily on dashboard read for the
              # current month; past months without a snapshot render
              # as an empty band in the UI, never a fabricated zero).
              composition:
                nullable: true
                type: object
                required: [cash, investment, pension, property, other]
                properties:
                  cash:
                    type: number
                  investment:
                    type: number
                  pension:
                    type: number
                  property:
                    type: number
                  other:
                    type: number

    # ── WISE ──────────────────────────────────────────────────────────────────
    WiseStatus:
      type: object
      required: [configured, connected]
      properties:
        configured:
          type: boolean
          description: Whether WISE_API_TOKEN is set in the environment
        connected:
          type: boolean
          description: Whether the token was successfully verified against the Wise API
        profileName:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    WiseSyncResult:
      type: object
      required: [synced, added, updated]
      properties:
        synced:
          type: integer
        added:
          type: integer
        updated:
          type: integer

    # ── IMPORT (CSV) ────────────────────────────────────────────────────────────
    ImportCsvInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    CsvImportResult:
      type: object
      required: [provider, added, skipped, errors]
      properties:
        provider:
          type: string
          enum: [revolut, maybank, monzo, hsbc, wise, chase]
        added:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    # ── SETTINGS (password + 2FA) ───────────────────────────────────────────────
    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    TwoFaStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    TwoFaSetupResult:
      type: object
      required: [secret, qrCodeDataUrl]
      properties:
        secret:
          type: string
        qrCodeDataUrl:
          type: string
          description: Data URL (PNG) — render directly in an <img> tag

    TwoFaConfirmInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TwoFaConfirmResult:
      type: object
      required: [ok, backupCodes]
      properties:
        ok:
          type: boolean
        backupCodes:
          type: array
          items:
            type: string
          description: Shown once — store these somewhere safe

    DisableTwoFaInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
