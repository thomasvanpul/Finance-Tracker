openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Personal Finance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: account
  - name: accounts
  - name: transactions
  - name: upcoming
  - name: investments
  - name: dashboard
  - name: market
  - name: wise
  - name: import
  - name: settings
  - name: debts
  - name: budgets
  - name: goals
  - name: subscriptions
  - name: connections

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── ADMIN ──────────────────────────────────────────────────────────────────
  # Operator-only. Gated by an environment allowlist (ADMIN_USER_IDS) on top
  # of the normal session auth; see artifacts/api-server/src/lib/admin-gate.ts.
  /admin/whoami:
    get:
      operationId: getAdminWhoami
      tags: [admin]
      summary: Whether the signed-in account is on the admin allowlist
      responses:
        "200":
          description: Answer
          content:
            application/json:
              schema:
                type: object
                required: [admin]
                properties:
                  admin: { type: boolean }

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Operations overview — services, ceilings, deploy state, users, traffic
      parameters:
        - in: query
          name: webCommit
          required: false
          schema:
            type: string
          description: >
            The commit the running web bundle was built from, baked in at build
            time. Sent by the SPA so the server can compare it with origin/main.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Signed in but not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminForbidden"

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get full dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── ACCOUNTS ───────────────────────────────────────────────────────────────
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /allocation:
    get:
      operationId: getAllocation
      tags: [allocation]
      summary: What can be spent today
      description: |
        A forward-looking daily allowance over a rolling 30-day window, moved
        by four inputs: pending `upcoming` expense rows in the window
        (including rows generated from subscription rules), pending `upcoming`
        income rows in the window, each goal's dated claim on future income
        (remaining / days until its deadline), and the observed reconciliation
        gap — balance movement the ledger does not explain.

        Drift only ever reduces the allowance. Unexplained money arriving is
        not treated as headroom, because a mis-keyed balance looks identical
        and honouring it would make the figure more optimistic on worse data.

        `dailyAllowance` is the number. Every other field is its
        decomposition, so one surface can show the figure and another the
        reasoning from one computation. When any leg cannot be computed —
        an unconvertible currency, no cash account, or too little snapshot
        history to measure drift — `status` is `unknown`, `dailyAllowance` is
        null and `blockers` names why. There is deliberately no partial
        figure to fall back to.
      responses:
        "200":
          description: Today's allowance and its decomposition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationResult"

  /accounts/reconciliation:
    get:
      operationId: getAccountsReconciliation
      tags: [accounts]
      summary: Money that moved through cash accounts without a transaction being recorded
      description: |
        Per cash account, (current balance − balance at the baseline snapshot)
        minus the signed effect of every transaction created on that account
        since the baseline was captured. Non-zero means money moved that the
        ledger does not explain — a manual balance correction, an edit or a
        deletion of an older transaction. The baseline is the earliest
        snapshot date (strictly before today) on which every current cash
        account has a row; when the 1st of the current month qualifies, the
        period is month-to-date. Below that minimum the status is
        `insufficient` and no figure is supplied.
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"

  /accounts/fx-drift:
    get:
      operationId: getAccountsFxDrift
      tags: [accounts]
      summary: How much of each account's change in base value was the exchange rate rather than the user
      description: |
        Per account, between the earliest balance snapshot held for it
        (strictly before today) and now:

          fxDeltaBase       = baselineBalance × (currentRate − baselineRate)
          activityDeltaBase = (currentBalance − baselineBalance) × currentRate
          totalDeltaBase    = fxDeltaBase + activityDeltaBase

        The two terms sum exactly to the change in base value, so a foreign
        account that has not been touched shows its whole movement as
        `fxDeltaBase` — the number no other screen states.

        The baseline rate is the one recorded on the snapshot at capture
        time. An account with no snapshot, no stored baseline rate, or no
        rate available today is counted in `unmeasurableAccounts` and
        omitted: today's rate is never applied backwards, because doing so
        would make `fxDeltaBase` zero by construction and report a real
        drift as no drift. `status` is `insufficient` when nothing is
        measurable.

        Unlike the reconciliation gap this covers ALL account types, not just
        cash — a foreign-currency property or pension is where the effect is
        largest.
      responses:
        "200":
          description: FX drift report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxDriftReport"

  /accounts/change-attribution:
    get:
      operationId: getAccountsChangeAttribution
      tags: [accounts]
      summary: The headline change in net worth, decomposed into what caused it
      description: |
        One period, one total, and the parts that add to it:

          rate      = Σ baselineBalance × (currentRate − baselineRate)
          activity  = Σ (currentBalance − baselineBalance) × currentRate
          total     = rate + activity

        and `activity` splits again per account by whether the ledger
        explains it:

          spend       = Σ signed transaction effects since the baseline, at currentRate
          residual    = activity − spend

        The residual on a cash account is `unexplained` — a balance that
        moved with no transaction behind it. On a property, pension or
        investment account it is `valuation`, because a revaluation is not a
        missing transaction. Four parts rather than three is what makes the
        arithmetic true.

        Unlike `/accounts/fx-drift`, every part is measured over ONE window,
        because a decomposition whose parts use different windows does not
        sum. The window follows the reconciliation rule: the baseline is a
        snapshot date strictly before today on which every measurable
        account has a row, month-to-date when the 1st qualifies.

        `residualBase` is `totalDeltaBase` minus the sum of the parts and is
        zero by construction; `balances` is false if it is not, so the
        surface can say the parts do not add up rather than round into
        agreement. An account with no snapshot on the baseline date, no rate
        recorded with it, or no rate today is counted in
        `unmeasurableAccounts` rather than attributed to zero. `status` is
        `insufficient` when no baseline qualifies, and `totalDeltaBase` is
        then null rather than zero.
      responses:
        "200":
          description: Change attribution report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeAttributionReport"

  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── TRANSACTIONS ───────────────────────────────────────────────────────────
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with optional filters
      parameters:
        - name: accountId
          in: query
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: [income, expense, transfer, null]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Monthly transaction summary
      parameters:
        - name: month
          in: query
          schema:
            type: ["string", "null"]
          description: YYYY-MM, defaults to current month
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"

  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── UPCOMING ───────────────────────────────────────────────────────────────
  /upcoming:
    get:
      operationId: listUpcoming
      tags: [upcoming]
      summary: List upcoming scheduled items
      responses:
        "200":
          description: List of upcoming items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingItem"
    post:
      operationId: createUpcomingItem
      tags: [upcoming]
      summary: Create an upcoming item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpcomingItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"

  /upcoming/summary:
    get:
      operationId: getUpcomingSummary
      tags: [upcoming]
      summary: 30-day committed outgoings and expected income
      responses:
        "200":
          description: Upcoming summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingSummary"

  /upcoming/installments:
    post:
      operationId: generateInstallments
      tags: [upcoming]
      summary: Generate monthly installment rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallmentInput"
      responses:
        "201":
          description: Created installments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingItem"

  /upcoming/{id}:
    patch:
      operationId: updateUpcomingItem
      tags: [upcoming]
      summary: Update an upcoming item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpcomingItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"
    delete:
      operationId: deleteUpcomingItem
      tags: [upcoming]
      summary: Delete an upcoming item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /upcoming/{id}/pay:
    post:
      operationId: payUpcomingItem
      tags: [upcoming]
      summary: Mark item as paid and auto-log to transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paid and transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingItem"

  # ── INVESTMENTS ────────────────────────────────────────────────────────────
  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      summary: List investment positions with live prices
      responses:
        "200":
          description: Investment positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
    post:
      operationId: createInvestment
      tags: [investments]
      summary: Add an investment position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"

  /investments/summary:
    get:
      operationId: getInvestmentSummary
      tags: [investments]
      summary: Portfolio totals
      responses:
        "200":
          description: Investment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentSummary"

  /investments/{id}:
    patch:
      operationId: updateInvestment
      tags: [investments]
      summary: Update an investment position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
    delete:
      operationId: deleteInvestment
      tags: [investments]
      summary: Delete an investment position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DEBTS / OWING ──────────────────────────────────────────────────────────
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: List all debt entries
      responses:
        "200":
          description: List of debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"
    post:
      operationId: createDebt
      tags: [debts]
      summary: Create a debt entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/summary:
    get:
      operationId: getDebtSummary
      tags: [debts]
      summary: Get debt totals summary
      responses:
        "200":
          description: Debt summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtSummary"

  /debts/{id}:
    patch:
      operationId: updateDebt
      tags: [debts]
      summary: Update a debt entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
    delete:
      operationId: deleteDebt
      tags: [debts]
      summary: Delete a debt entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /debts/{id}/settle:
    post:
      operationId: settleDebt
      tags: [debts]
      summary: Mark a debt as settled
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  # ── MARKET DATA ────────────────────────────────────────────────────────────
  /market/fx-rates:
    get:
      operationId: getFxRates
      tags: [market]
      summary: Get live FX rates (GBP base)
      responses:
        "200":
          description: FX rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"

  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Get live stock prices for given tickers
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols
      responses:
        "200":
          description: Stock prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockPrice"

  /market/quotes:
    get:
      operationId: getMarketQuotes
      tags: [market]
      summary: Get rich fundamental data for given tickers
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated ticker symbols
      responses:
        "200":
          description: Stock quotes with fundamental data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockQuote"

  # ── WISE ───────────────────────────────────────────────────────────────────
  /wise/status:
    get:
      operationId: getWiseStatus
      tags: [wise]
      summary: Check whether a Wise personal API token is configured and valid
      responses:
        "200":
          description: Wise connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiseStatus"

  /wise/sync:
    post:
      operationId: syncWiseTransactions
      tags: [wise]
      summary: Sync balances and transactions from Wise using the configured personal API token
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiseSyncResult"

  # ── CONNECTIONS ───────────────────────────────────────────────────────────
  # Per-user provider connections. Credentials are encrypted at rest and
  # NEVER appear in a response body — see docs/CREDENTIAL-ENCRYPTION.md.
  /connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: List the current user's connections. Credentials are never returned.
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a connection. Adapter validates the credential before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionInput"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: Invalid input or the provider rejected the credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{id}:
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection. Also deletes the encrypted credential.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connections/{id}/sync:
    post:
      operationId: syncConnection
      tags: [connections]
      summary: Run the provider sync for this connection.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSyncResult"
        "400":
          description: Adapter reported a typed failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSyncFailure"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── IMPORT (CSV) ─────────────────────────────────────────────────────────────
  /import/csv:
    post:
      operationId: importCsv
      tags: [import]
      summary: Import transactions from a bank-exported CSV file (Revolut or Maybank)
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [revolut, maybank, monzo, hsbc, wise, chase]
        - name: accountId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportCsvInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  # ── BUDGETS ────────────────────────────────────────────────────────────────
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List all budgets for the current user
      responses:
        "200":
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      operationId: createBudget
      tags: [budgets]
      summary: Create a new budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetBody"
      responses:
        "201":
          description: Created budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"

  /budgets/{id}:
    put:
      operationId: updateBudget
      tags: [budgets]
      summary: Update a budget's monthly limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetBody"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
    delete:
      operationId: deleteBudget
      tags: [budgets]
      summary: Delete a budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  # ── GOALS ─────────────────────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all savings goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /goals/{id}/add-funds:
    post:
      operationId: addGoalFunds
      tags: [goals]
      summary: Add funds to a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  # ── RECURRING PATTERNS ────────────────────────────────────────────────────
  /recurring-patterns:
    get:
      operationId: listRecurringPatterns
      tags: [recurring]
      summary: Detect and list recurring transaction patterns
      responses:
        "200":
          description: List of detected recurring patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringPattern"

  # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/dismissed:
    get:
      operationId: listDismissedSubscriptions
      tags: [subscriptions]
      summary: List dismissed subscription candidates
      responses:
        "200":
          description: List of dismissed descriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      operationId: dismissSubscription
      tags: [subscriptions]
      summary: Dismiss a detected subscription candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
      responses:
        "201":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /subscriptions/{id}:
    put:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  # ── EXPORT ────────────────────────────────────────────────────────────────
  /export/backup:
    get:
      operationId: downloadBackup
      tags: [settings]
      summary: Download full data backup as JSON
      responses:
        "200":
          description: JSON backup file
          content:
            application/json:
              schema:
                type: object

  # ── ACCOUNT (the user's own account, not a bank account) ──────────────────
  /account/delete:
    post:
      operationId: deleteUserAccount
      tags: [account]
      summary: Delete the signed-in user's account and everything they own
      description: >-
        Irreversible. Removes the user row; every user-owned table cascades
        from it (accounts, transactions, upcoming, investments, debts,
        budgets, goals, subscriptions, connections and their encrypted
        credentials, snapshots, recurring patterns, shared expenses, sessions,
        passkeys, 2FA). Verification tokens are deleted by email; request
        metrics keep their timing rows with the user id removed. Rows in
        other users' data that named this user keep their text and lose the
        link. Third-party tokens (Wise, Alpaca, Kraken, OAuth grants) are
        destroyed here, not revoked at the provider. Confirmation is the
        account email, typed exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserAccountInput"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserAccountResult"
        "400":
          description: The typed email does not match the account

  # ── SETTINGS (currency) ────────────────────────────────────────────────────
  /settings/currency:
    get:
      operationId: getSettingsCurrency
      tags: [settings]
      summary: Get the current base currency
      responses:
        "200":
          description: Base currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencySettings"
    put:
      operationId: updateSettingsCurrency
      tags: [settings]
      summary: Update the base currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencySettings"
      responses:
        "200":
          description: Updated

  /settings/persona:
    get:
      operationId: getSettingsPersona
      tags: [settings]
      summary: Get the current user's persona
      responses:
        "200":
          description: Persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaState"
    put:
      operationId: updateSettingsPersona
      tags: [settings]
      summary: Set the current user's persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaSettings"
      responses:
        "200":
          description: Updated

  /settings/theme:
    get:
      operationId: getSettingsTheme
      tags: [settings]
      summary: Get the current user's theme
      responses:
        "200":
          description: Theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeSettings"
    put:
      operationId: updateSettingsTheme
      tags: [settings]
      summary: Set the current user's theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeSettings"
      responses:
        "200":
          description: Updated

  /settings/preferences:
    get:
      operationId: getSettingsPreferences
      tags: [settings]
      summary: Every account-level UI preference for the current user
      description: >-
        Opaque string values keyed by the same names the client uses in
        localStorage (BACKLOG § G20/B). The server does not interpret them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    patch:
      operationId: updateSettingsPreferences
      tags: [settings]
      summary: Upsert (string) or remove (null) account-level preferences
      description: >-
        At most 50 keys per request; keys match ^[a-z][a-z0-9:_.-]{1,63}$;
        values are at most 262144 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesPatchResult"
        "400":
          description: Invalid key, value type, size, or too many keys
  /settings/tab-slot:
    get:
      operationId: getSettingsTabSlot
      tags: [settings]
      summary: Get the current user's phone tab-slot override
      responses:
        "200":
          description: Tab slot override (null when following the persona default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabSlotSettings"
    put:
      operationId: updateSettingsTabSlot
      tags: [settings]
      summary: Set (or clear, with null) the current user's phone tab-slot override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabSlotSettings"
      responses:
        "200":
          description: Updated

components:
  schemas:
    AdminForbidden:
      type: object
      required: [error, reason]
      properties:
        error: { type: string }
        reason: { type: string }

    AdminCeiling:
      type: object
      required: [label, limit, unit, symptom, source]
      properties:
        label: { type: string }
        limit:
          type: number
          nullable: true
        unit: { type: string }
        symptom: { type: string }
        source:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [measurable, stated]
            via: { type: string }
            checkedOn: { type: string }

    AdminServiceFact:
      type: object
      required: [id, name, category, role, plan, monthlyCostGbp, nextPlan, ceilings, launchBlocker, checkedOn, dashboardUrl]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [infrastructure, market-data, ai, monitoring]
        role: { type: string }
        plan: { type: string }
        monthlyCostGbp: { type: number }
        nextPlan:
          type: object
          nullable: true
          required: [name, monthlyCostGbp]
          properties:
            name: { type: string }
            monthlyCostGbp: { type: number }
        ceilings:
          type: array
          items:
            $ref: "#/components/schemas/AdminCeiling"
        launchBlocker:
          type: string
          nullable: true
        checkedOn: { type: string }
        dashboardUrl:
          type: string
          nullable: true

    AdminDeployTruth:
      type: object
      required: [apiCommit, apiCommitSource, webCommit, originMainCommit, originMainSource, verdict, detail]
      properties:
        apiCommit: { type: string, nullable: true }
        apiCommitSource: { type: string, nullable: true }
        webCommit: { type: string, nullable: true }
        originMainCommit: { type: string, nullable: true }
        originMainSource: { type: string, nullable: true }
        verdict:
          type: string
          enum: [match, behind, unknown]
        detail: { type: string }

    AdminUserRow:
      type: object
      required: [id, email, createdAt, holdings]
      properties:
        id: { type: string }
        email: { type: string }
        createdAt: { type: string }
        holdings:
          type: object
          required: [accounts, transactions, investments, goals, budgets, debts, subscriptions, connections]
          properties:
            accounts: { type: integer }
            transactions: { type: integer }
            investments: { type: integer }
            goals: { type: integer }
            budgets: { type: integer }
            debts: { type: integer }
            subscriptions: { type: integer }
            connections: { type: integer }

    AdminRouteTiming:
      type: object
      required: [route, samples, p95Ms, p50Ms]
      properties:
        route: { type: string }
        samples: { type: integer }
        p95Ms: { type: integer }
        p50Ms: { type: integer }

    AdminRouteErrors:
      type: object
      required: [route, samples, errors]
      properties:
        route: { type: string }
        samples: { type: integer }
        errors: { type: integer }

    AdminTraffic:
      type: object
      required: [windowDays, requests, serverErrors, clientErrors, errorRatePct, slowestRoutes, failingRoutes, byClient, clientSplitNote]
      properties:
        windowDays: { type: integer }
        requests: { type: integer }
        serverErrors: { type: integer }
        clientErrors: { type: integer }
        errorRatePct:
          type: number
          nullable: true
        slowestRoutes:
          type: array
          items:
            $ref: "#/components/schemas/AdminRouteTiming"
        failingRoutes:
          type: array
          items:
            $ref: "#/components/schemas/AdminRouteErrors"
        byClient:
          type: object
          required: [phone, desktop, unclassified]
          properties:
            phone: { type: integer }
            desktop: { type: integer }
            unclassified: { type: integer }
        clientSplitNote:
          type: string
          nullable: true

    AdminProviderHealth:
      type: object
      required: [name, configured, breaker, consecutiveFailures, cooldownUntil, lastOk, lastError, creditsUsedToday, creditsBudget, creditsResetAt]
      properties:
        name: { type: string }
        configured: { type: boolean }
        breaker:
          type: string
          enum: [closed, open, half]
        consecutiveFailures: { type: integer }
        cooldownUntil: { type: string, nullable: true }
        lastOk: { type: string, nullable: true }
        lastError:
          type: object
          nullable: true
          required: [message, ts]
          properties:
            message: { type: string }
            ts: { type: string }
        creditsUsedToday: { type: integer }
        creditsBudget:
          type: integer
          nullable: true
        creditsResetAt: { type: string }

    AdminAiProviderHealth:
      type: object
      required: [name, keyConfigured, models, modelsVerified, verifiedAt, lastError]
      properties:
        name: { type: string }
        keyConfigured: { type: boolean }
        models:
          type: array
          items: { type: string }
        modelsVerified: { type: boolean, nullable: true }
        verifiedAt: { type: string, nullable: true }
        lastError: { type: string, nullable: true }

    AdminOverview:
      type: object
      required: [generatedAt, gate, services, deploy, providers, ai, yahooRichQuote, users, traffic]
      properties:
        generatedAt: { type: string }
        gate:
          type: object
          required: [matchedOn]
          properties:
            matchedOn:
              type: string
              enum: [user-id, email]
        services:
          type: object
          required: [facts, totalMonthlyCostGbp, launchBlockerIds, oldestCheckDate]
          properties:
            facts:
              type: array
              items:
                $ref: "#/components/schemas/AdminServiceFact"
            totalMonthlyCostGbp: { type: number }
            launchBlockerIds:
              type: array
              items: { type: string }
            oldestCheckDate: { type: string }
        deploy:
          $ref: "#/components/schemas/AdminDeployTruth"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AdminProviderHealth"
        ai:
          type: object
          required: [available, providers]
          properties:
            available: { type: boolean }
            providers:
              type: array
              items:
                $ref: "#/components/schemas/AdminAiProviderHealth"
        yahooRichQuote:
          type: object
          required: [degradedCount, degradedSince, lastError]
          properties:
            degradedCount: { type: integer }
            degradedSince: { type: string, nullable: true }
            lastError: { type: string, nullable: true }
        users:
          type: object
          required: [total, signupsByDay, accounts]
          properties:
            total: { type: integer }
            signupsByDay:
              type: array
              items:
                type: object
                required: [day, count]
                properties:
                  day: { type: string }
                  count: { type: integer }
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/AdminUserRow"
        traffic:
          $ref: "#/components/schemas/AdminTraffic"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Connection:
      type: object
      required: [id, provider, label, status, createdAt]
      description: |
        Per-user provider connection. Credentials are encrypted at rest and
        MUST NEVER appear on this shape or on any shape returned by a
        connection endpoint. If you add a field here, verify no test in
        connections.test.ts fires because you leaked a secret.
      properties:
        id:
          type: integer
        provider:
          type: string
          description: Provider slug (e.g. "wise")
        label:
          type: string
        status:
          type: string
          enum: [pending, active, error, revoked]
        lastSyncedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateConnectionInput:
      type: object
      required: [provider, credential]
      properties:
        provider:
          type: string
          description: Provider slug (e.g. "wise")
        credential:
          type: string
          description: |
            The provider secret. Sent once at connection time, encrypted
            immediately, and never returned. Do NOT log or echo.
        label:
          type: string
          description: Optional user-supplied label. If omitted, the adapter suggests one.

    ConnectionSyncResult:
      type: object
      required: [connectionId, accountsUpserted, transactionsAdded, transactionsUpdated]
      properties:
        connectionId:
          type: integer
        accountsUpserted:
          type: integer
        transactionsAdded:
          type: integer
        transactionsUpdated:
          type: integer

    ConnectionSyncFailure:
      type: object
      required: [error, kind]
      properties:
        error:
          type: string
        kind:
          type: string
          enum: [auth, rate_limit, network, provider, invalid_response]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── ACCOUNT ──────────────────────────────────────────────────────────────
    ReconciliationAccount:
      type: object
      required: [accountId, name, currency, baselineDate, baselineBalance, currentBalance, balanceChange, ledgerChange, gap, gapBase, transactionsCounted, editedSinceBaseline, fxSkippedTransactions]
      properties:
        accountId:
          type: integer
        name:
          type: string
        currency:
          type: string
        baselineDate:
          type: string
          description: YYYY-MM-DD of the snapshot this account is measured from
        baselineBalance:
          type: number
          description: Native balance stored in the baseline snapshot
        currentBalance:
          type: number
          description: Native balance now
        balanceChange:
          type: number
          description: currentBalance − baselineBalance, native
        ledgerChange:
          type: number
          description: Signed sum of transactions created on this account after the baseline was captured, native
        gap:
          type: number
          description: balanceChange − ledgerChange, native. Positive means the balance rose more than the ledger records.
        # Nullable: toBase returns null when the FX rate is unavailable.
        gapBase:
          type: ["number", "null"]
        transactionsCounted:
          type: integer
        editedSinceBaseline:
          type: integer
          description: Transactions created before the baseline but updated after it — their change to the balance is not recoverable, so part of the gap may be theirs
        fxSkippedTransactions:
          type: integer
          description: Transactions in a currency other than the account's whose conversion was unavailable and were left out of ledgerChange
    AllocationGoalClaim:
      type: object
      required: [id, name, remaining, deadline, daysRemaining, perDay, claimedOverWindow, basis]
      properties:
        id:
          type: integer
        name:
          type: string
        remaining:
          type: number
          description: target − current, floored at 0
        deadline:
          type: ["string", "null"]
          description: YYYY-MM-DD. null when the claim rests on a stated monthly contribution instead.
        daysRemaining:
          type: ["integer", "null"]
          description: Days from today to the deadline; negative when overdue. null for a monthly-contribution claim.
        perDay:
          type: number
          description: What this goal claims per day
        claimedOverWindow:
          type: number
          description: What this goal claims across the whole window; never more than remaining
        basis:
          type: string
          enum: [deadline, monthly-contribution]
    AllocationResult:
      type: object
      required: [status, blockers, baseCurrency, today, horizonDays, windowEnd, dailyAllowance, availableNow, expectedIncome, committedOut, goalClaim, driftReduction, goalClaims, goalsWithoutClaim, cashAccountsCounted, cashAccountsUnconvertible, upcomingCounted, upcomingUnconvertible, driftGapBase, driftPerDay, driftDays, minDriftDays]
      properties:
        status:
          type: string
          enum: [ok, unknown]
          description: ok when every leg was computable; unknown when any was not.
        blockers:
          type: array
          description: Why the number was withheld. Empty when status is ok.
          items:
            type: string
            enum: [no-cash-accounts, cash-unconvertible, upcoming-unconvertible, drift-insufficient-history, drift-unconvertible]
        baseCurrency:
          type: string
        today:
          type: string
          description: YYYY-MM-DD, server-local
        horizonDays:
          type: integer
        windowEnd:
          type: string
          description: today + horizonDays, YYYY-MM-DD, inclusive
        # THE NUMBER. Null whenever status is unknown; there is no second figure.
        dailyAllowance:
          type: ["number", "null"]
          description: What can be spent today, in base currency. May be negative when commitments exceed what is available.
        availableNow:
          type: ["number", "null"]
          description: Cash-type account balances converted to base. null when any could not be converted.
        expectedIncome:
          type: ["number", "null"]
          description: Dated income due inside the window. null when any row could not be converted.
        committedOut:
          type: ["number", "null"]
          description: Dated obligations due inside the window. null when any row could not be converted.
        goalClaim:
          type: number
          description: What every goal claims across the window, in base. Never null — a goal that makes no dated claim is counted in goalsWithoutClaim rather than guessed at.
        driftReduction:
          type: ["number", "null"]
          description: Positive amount by which measured drift lowers the window. null when drift could not be measured.
        goalClaims:
          type: array
          items:
            $ref: "#/components/schemas/AllocationGoalClaim"
        goalsWithoutClaim:
          type: integer
          description: Goals already met, or with neither a usable deadline nor a stated monthly contribution. These make the allowance more generous, so the count is reported.
        cashAccountsCounted:
          type: integer
        cashAccountsUnconvertible:
          type: integer
        upcomingCounted:
          type: integer
        upcomingUnconvertible:
          type: integer
        driftGapBase:
          type: ["number", "null"]
          description: The measured gap itself, signed. Negative means money left that the ledger does not explain.
        driftPerDay:
          type: ["number", "null"]
        driftDays:
          type: integer
          description: Days the gap was measured over
        minDriftDays:
          type: integer
          description: >-
            The shortest observed period the drift term will extrapolate from
            (MIN_DRIFT_DAYS). Published for the same reason horizonDays is: a
            client that must say "4 of 7 days of history, your allowance
            appears on the 14th" needs the 7, and the alternative is a second
            copy of the constant in the client that can silently disagree with
            the engine's. It is a stated policy, not a measurement.
    ReconciliationReport:
      type: object
      required: [status, baseCurrency, periodRule, periodFrom, periodTo, days, dataAvailableSince, gapBase, accounts, unconvertibleAccounts]
      properties:
        status:
          type: string
          enum: [ok, insufficient]
        baseCurrency:
          type: string
        periodRule:
          type: ["string", "null"]
          enum: [month-to-date, since-first-snapshot, null]
          description: Which period rule produced periodFrom. null when insufficient.
        periodFrom:
          type: ["string", "null"]
          description: Baseline date, YYYY-MM-DD. null when insufficient.
        periodTo:
          type: string
          description: Today, YYYY-MM-DD, server-local
        days:
          type: integer
          description: periodTo − periodFrom in days; 0 when insufficient
        dataAvailableSince:
          type: ["string", "null"]
          description: Earliest snapshot date held for any cash account, whether or not it qualifies as a baseline. null when there are no snapshots.
        # Nullable: null when insufficient, or when no account's gap could be converted.
        gapBase:
          type: ["number", "null"]
          description: Sum of gapBase over convertible accounts
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationAccount"
        unconvertibleAccounts:
          type: integer
          description: Cash accounts whose gap could not be converted to base and are missing from gapBase
    FxDriftAccount:
      type: object
      required: [accountId, name, currency, type, baselineDate, baselineBalance, baselineRate, currentBalance, currentRate, fxDeltaBase, activityDeltaBase, totalDeltaBase, lastTransactionDate, daysSinceLastTransaction]
      properties:
        accountId:
          type: integer
        name:
          type: string
        currency:
          type: string
        type:
          type: string
        baselineDate:
          type: string
          description: YYYY-MM-DD of the snapshot this account is measured from
        baselineBalance:
          type: number
          description: Native balance stored in the baseline snapshot
        baselineRate:
          type: number
          description: Native-to-base rate recorded on the baseline snapshot at capture time. Never re-derived.
        currentBalance:
          type: number
          description: Native balance now
        currentRate:
          type: number
          description: Native-to-base rate now
        fxDeltaBase:
          type: number
          description: baselineBalance × (currentRate − baselineRate) — the part of the movement the user did not cause
        activityDeltaBase:
          type: number
          description: (currentBalance − baselineBalance) × currentRate — the part the user did cause, priced at today's rate
        totalDeltaBase:
          type: number
          description: fxDeltaBase + activityDeltaBase, equal to the change in base value over the period
        # Nullable: an account may have no transactions at all.
        lastTransactionDate:
          type: ["string", "null"]
          description: YYYY-MM-DD of the newest transaction on this account
        # Nullable: null exactly when lastTransactionDate is null.
        daysSinceLastTransaction:
          type: ["integer", "null"]
    FxDriftReport:
      type: object
      required: [status, baseCurrency, periodFrom, periodTo, days, dataAvailableSince, accounts, unmeasurableAccounts]
      properties:
        status:
          type: string
          enum: [ok, insufficient]
        baseCurrency:
          type: string
        # Nullable: null when no account has a usable baseline.
        periodFrom:
          type: ["string", "null"]
          description: Earliest baseline actually used, YYYY-MM-DD
        periodTo:
          type: string
          description: Today, YYYY-MM-DD, server-local
        days:
          type: integer
          description: periodTo − periodFrom in days; 0 when insufficient
        # Nullable: null when no snapshots are held at all.
        dataAvailableSince:
          type: ["string", "null"]
          description: Earliest snapshot date held for any account, measurable or not
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/FxDriftAccount"
        unmeasurableAccounts:
          type: integer
          description: Accounts with no usable baseline — no snapshot before today, or no rate captured with it. Named so the UI can say what is missing instead of implying the drift is zero.
    ChangeAttributionAccountShare:
      type: object
      required: [accountId, name, currency, amountBase, fromRate, toRate]
      properties:
        accountId:
          type: integer
        name:
          type: string
        currency:
          type: string
        amountBase:
          type: number
          description: This account's contribution to the part, in base currency
        # Nullable: only the rate part is priced between two rates.
        fromRate:
          type: ["number", "null"]
          description: Native-to-base rate recorded on the baseline snapshot. Null on every part but `rate`.
        # Nullable: as fromRate.
        toRate:
          type: ["number", "null"]
          description: Native-to-base rate now. Null on every part but `rate`.
    ChangeAttributionPart:
      type: object
      required: [kind, amountBase, transactions, accounts]
      properties:
        kind:
          type: string
          enum: [spend, rate, valuation, unexplained]
          description: |
            spend — the signed ledger effect. rate — the exchange rate moving
            under a balance nobody touched. valuation — a non-cash balance
            that moved with no transaction, which is a revaluation rather
            than a missing row. unexplained — the same on a cash account,
            where it is the reconciliation gap.
        amountBase:
          type: number
        # Nullable: only the spend part counts ledger rows.
        transactions:
          type: ["integer", "null"]
          description: How many ledger rows were summed. Null on every part but `spend`.
        accounts:
          type: array
          description: Which accounts made up this part, largest magnitude first. Never empty — a part that contributed nothing is omitted rather than reported as zero.
          items:
            $ref: "#/components/schemas/ChangeAttributionAccountShare"
    ChangeAttributionReport:
      type: object
      required: [status, baseCurrency, periodRule, periodFrom, periodTo, days, dataAvailableSince, totalDeltaBase, parts, residualBase, balances, measuredAccounts, unmeasurableAccounts]
      properties:
        status:
          type: string
          enum: [ok, insufficient]
        baseCurrency:
          type: string
        periodRule:
          type: ["string", "null"]
          enum: [month-to-date, since-first-snapshot, null]
        periodFrom:
          type: ["string", "null"]
          description: Baseline date, YYYY-MM-DD. null when insufficient.
        periodTo:
          type: string
          description: Today, YYYY-MM-DD, server-local
        days:
          type: integer
        # Nullable: null when there is no usable snapshot at all.
        dataAvailableSince:
          type: ["string", "null"]
          description: Earliest snapshot date usable for attribution, whether or not it qualifies as a baseline
        # Nullable: null when insufficient. Never zero standing in for unknown.
        totalDeltaBase:
          type: ["number", "null"]
          description: The headline. Equal to the sum of the parts.
        parts:
          type: array
          items:
            $ref: "#/components/schemas/ChangeAttributionPart"
        residualBase:
          type: number
          description: totalDeltaBase − Σ parts. Zero by construction; carried so a consumer can check rather than trust.
        balances:
          type: boolean
          description: False means the parts do not add to the headline and the surface must say so rather than rounding into agreement
        measuredAccounts:
          type: integer
        unmeasurableAccounts:
          type: integer
          description: Accounts with no snapshot on the baseline date, no rate recorded with it, or no rate today. Counted rather than attributed to zero.
    Account:
      type: object
      required: [id, name, currency, balance, baseEquivalent, type, isWiseLinked, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        # Nullable: toBase returns null when the FX rate for this
        # account's currency is unavailable. Consumers render the native
        # amount alone (never a fabricated base-currency zero or a bare dash where a native figure
        # exists).
        baseEquivalent:
          type: ["number", "null"]
        type:
          type: string
          enum: [cash, investment, pension, property, other, liability]
        isWiseLinked:
          type: boolean
        wiseProfileId:
          type: ["string", "null"]
        wiseBalanceId:
          type: ["string", "null"]
        lastSyncedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    AccountInput:
      type: object
      required: [name, currency, balance]
      properties:
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        type:
          type: string
          enum: [cash, investment, pension, property, other, liability]

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        balance:
          type: number
        type:
          type: string
          enum: [cash, investment, pension, property, other, liability]

    # ── TRANSACTION ──────────────────────────────────────────────────────────
    Transaction:
      type: object
      required: [id, date, description, type, category, accountId, accountName, nativeAmount, currency, baseEquivalent, source, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        accountName:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
        # Nullable: null when the transaction's FX rate is unavailable.
        # Sign follows the transaction type (expense = negative). Rows
        # render the native amount alone (never a fabricated base-currency zero or a bare dash).
        # Value is in the USER'S BASE CURRENCY, not literal GBP — the
        # name was renamed from gbpValue on 30 Aug 2026 to remove the
        # split contract lie (accounts/upcoming/debts were already
        # baseEquivalent; transactions and investments were gbpValue).
        baseEquivalent:
          type: ["number", "null"]
        source:
          type: string
          enum: [manual, wise, csv]
        externalId:
          type: ["string", "null"]
        createdAt:
          type: string
        # Transfer link (see TransactionInput). Null/absent on any row that
        # is not one leg of a linked transfer.
        transferGroupId:
          type: ["string", "null"]
          format: uuid
        transferDirection:
          type: ["string", "null"]
          enum: [out, in, null]

    TransactionInput:
      type: object
      required: [date, description, type, category, accountId, nativeAmount, currency]
      properties:
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        nativeAmount:
          type: number
        currency:
          type: string
        # Transfer leg (type=transfer only). When present the server writes
        # a linked pair — an "out" row on accountId and an "in" row on
        # toAccountId — sharing one transferGroupId. Added to the spec on
        # 5 Sep 2026: 84f4dff had hand-edited these into the generated zod
        # without declaring them here, so the next codegen silently
        # dropped them and broke the api-server typecheck.
        toAccountId:
          type: integer
        toNativeAmount:
          type: number
        toCurrency:
          type: string

    TransactionUpdate:
      type: object
      properties:
        date:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [income, expense, transfer]
        category:
          type: string
        accountId:
          type: integer
        nativeAmount:
          type: number
        currency:
          type: string

    TransactionSummary:
      type: object
      required: [month, totalIncome, totalExpenses, netSavings, savingsRate]
      properties:
        month:
          type: string
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netSavings:
          type: number
        # Null when there is no income in the period. A savings rate is
        # undefined without a denominator, not zero — a fabricated "0.0%"
        # reads as "you saved nothing" to a user who simply had no income
        # recorded. Clients render an em-dash.
        savingsRate:
          type: ["number", "null"]

    # ── UPCOMING ─────────────────────────────────────────────────────────────
    UpcomingItem:
      type: object
      required: [id, dueDate, description, category, type, frequency, status, nativeAmount, currency, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        status:
          type: string
          enum: [pending, paid, skipped]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        # Nullable: null when FX for this upcoming item's currency is
        # unavailable. Rows render the native amount alone.
        baseEquivalent:
          type: ["number", "null"]
        accountId:
          type: ["integer", "null"]
        accountName:
          type: ["string", "null"]
        createdAt:
          type: string

    UpcomingItemInput:
      type: object
      required: [dueDate, description, category, type, frequency, nativeAmount, currency]
      properties:
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        accountId:
          type: ["integer", "null"]

    UpcomingItemUpdate:
      type: object
      properties:
        dueDate:
          type: string
        description:
          type: string
        category:
          type: string
        type:
          type: string
          enum: [income, expense]
        frequency:
          type: string
          enum: [one-time, weekly, monthly, quarterly, yearly]
        status:
          type: string
          enum: [pending, paid, skipped]
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        accountId:
          type: ["integer", "null"]

    UpcomingSummary:
      type: object
      required: [committedOutgoings30d, expectedIncome30d]
      properties:
        committedOutgoings30d:
          type: number
        expectedIncome30d:
          type: number

    InstallmentInput:
      type: object
      required: [description, category, totalAmount, currency, numberOfMonths, startDate]
      properties:
        description:
          type: string
        category:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        numberOfMonths:
          type: integer
        startDate:
          type: string
        accountId:
          type: ["integer", "null"]

    # ── INVESTMENTS ──────────────────────────────────────────────────────────
    Investment:
      type: object
      # priceAvailable is the honesty flag: when the market API cannot supply
      # a live price for a ticker (rate limit, outage, unknown symbol), all
      # price-derived fields (livePrice, currentValue, plBase, plPercent,
      # baseEquivalent) come back as null. Consumers MUST render "—" or a skeleton
      # rather than substituting zero — a fabricated 0 renders as −100.00%
      # against the cost basis, which is the G10 defect this contract fixes.
      # baseEquivalent and plBase are ALSO null when the FX pivot to the
      # user's base currency fails (30 Aug 2026: previously these were
      # named gbpValue/plGbp and computed against literal GBP regardless
      # of the user's base — see enrich-investment.ts for the fix note).
      required: [id, ticker, name, buyDate, shares, costPricePerShare, currency, priceAvailable, livePrice, currentValue, plBase, plPercent, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number
        currency:
          type: string
        priceAvailable:
          type: boolean
        livePrice:
          type: [number, "null"]
        currentValue:
          type: [number, "null"]
        plBase:
          type: [number, "null"]
        plPercent:
          type: [number, "null"]
        baseEquivalent:
          type: [number, "null"]
        createdAt:
          type: string

    InvestmentInput:
      type: object
      required: [ticker, name, buyDate, shares, costPricePerShare]
      properties:
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number

    InvestmentUpdate:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        buyDate:
          type: string
        shares:
          type: number
        costPricePerShare:
          type: number

    InvestmentSummary:
      type: object
      # totals sum ONLY positions with priceAvailable=true. unavailablePositions
      # counts positions whose price the market API could not supply; those are
      # excluded from every total. Consumers should surface the count so the
      # user understands the roll-up is partial.
      required: [totalValueBase, totalPlBase, totalPlPercent, positions, unavailablePositions]
      properties:
        totalValueBase:
          type: number
        totalPlBase:
          type: number
        # Nullable: percentage is undefined when the portfolio's cost
        # basis is zero (no holdings). Rendering "+0.00%" for a user who
        # holds nothing is a fabricated return the data does not support;
        # null signals "no return to compute" so consumers render "—".
        totalPlPercent:
          type: ["number", "null"]
        positions:
          type: integer
        unavailablePositions:
          type: integer

    # ── DEBTS ─────────────────────────────────────────────────────────────────
    Debt:
      type: object
      required: [id, personName, description, date, nativeAmount, currency, direction, status, baseEquivalent, createdAt]
      properties:
        id:
          type: integer
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        status:
          type: string
          enum: [pending, settled]
        notes:
          type: ["string", "null"]
        accountId:
          type: ["integer", "null"]
        # Nullable: null when the debt's FX rate is unavailable. Rows
        # render the native amount alone.
        baseEquivalent:
          type: ["number", "null"]
        createdAt:
          type: string
        linkedEmail:
          type: ["string", "null"]
        linkedUserId:
          type: ["string", "null"]
        isReceived:
          type: boolean
        sourceDebtId:
          type: ["integer", "null"]

    DebtInput:
      type: object
      required: [personName, description, date, nativeAmount, currency, direction]
      properties:
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        notes:
          type: string
        accountId:
          type: integer
        linkedEmail:
          type: string

    DebtUpdate:
      type: object
      properties:
        personName:
          type: string
        description:
          type: string
        date:
          type: string
        nativeAmount:
          type: number
        currency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]
        direction:
          type: string
          enum: [i_owe_them, they_owe_me]
        status:
          type: string
          enum: [pending, settled]
        notes:
          type: string
        accountId:
          type: integer

    DebtSummary:
      type: object
      required: [totalOwedToMe, totalIOwe, netBase, pendingCount]
      properties:
        totalOwedToMe:
          type: number
        totalIOwe:
          type: number
        netBase:
          type: number
        pendingCount:
          type: integer

    # ── BUDGETS ──────────────────────────────────────────────────────────────
    Budget:
      type: object
      required: [id, category, monthlyLimit]
      properties:
        id:
          type: integer
        category:
          type: string
        monthlyLimit:
          type: number

    CreateBudgetBody:
      type: object
      required: [category, monthlyLimit]
      properties:
        category:
          type: string
        monthlyLimit:
          type: number
          minimum: 0.01

    UpdateBudgetBody:
      type: object
      required: [monthlyLimit]
      properties:
        monthlyLimit:
          type: number
          minimum: 0.01

    # ── GOALS ────────────────────────────────────────────────────────────────
    GoalHistoryEntry:
      type: object
      required: [date, amount]
      properties:
        date:
          type: string
        amount:
          type: number

    Goal:
      type: object
      required: [id, name, target, current, history]
      properties:
        id:
          type: integer
        name:
          type: string
        target:
          type: number
        current:
          type: number
        deadline:
          type: string
        emoji:
          type: string
        color:
          type: string
        image:
          type: string
        monthlyContribution:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    CreateGoalBody:
      type: object
      required: [name, target]
      properties:
        name:
          type: string
        target:
          type: number
          minimum: 0.01
        current:
          type: number
        deadline:
          type: string
        emoji:
          type: string
        color:
          type: string
        image:
          type: string
        monthlyContribution:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    UpdateGoalBody:
      type: object
      properties:
        name:
          type: string
        target:
          type: number
        current:
          type: number
        deadline:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        monthlyContribution:
          type: number
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryEntry"

    # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────
    RecurringPattern:
      type: object
      required: [id, normalizedKey, displayName, intervalDays, expectedAmount, currency, lastOccurrence, occurrenceCount, status]
      properties:
        id:
          type: string
          format: uuid
        normalizedKey:
          type: string
        displayName:
          type: string
        intervalDays:
          type: integer
        expectedAmount:
          type: number
        currency:
          type: string
        lastOccurrence:
          type: string
        nextExpected:
          type: string
        occurrenceCount:
          type: integer
        status:
          type: string
          enum: [active, lapsed]

    Subscription:
      type: object
      required: [id, name, amount, currency, frequency, category, startDate, active, manuallyAdded]
      properties:
        id:
          type: integer
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
        manuallyAdded:
          type: boolean

    CreateSubscriptionBody:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
        manuallyAdded:
          type: boolean

    UpdateSubscriptionBody:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        frequency:
          type: string
          enum: [weekly, monthly, quarterly, annual]
        category:
          type: string
        nextDue:
          type: string
          nullable: true
        startDate:
          type: string
        active:
          type: boolean
        notes:
          type: string
          nullable: true
        manuallyAdded:
          type: boolean

    # ── MARKET DATA ──────────────────────────────────────────────────────────
    FxRates:
      type: object
      required: [base, rates, updatedAt]
      properties:
        base:
          type: string
        rates:
          type: object
          additionalProperties:
            type: number
        updatedAt:
          type: string

    StockPrice:
      type: object
      required: [ticker, price, currency, updatedAt]
      properties:
        ticker:
          type: string
        price:
          type: number
        currency:
          type: string
        updatedAt:
          type: string

    StockQuote:
      type: object
      required: [ticker, price, currency, updatedAt]
      properties:
        ticker:
          type: string
        price:
          type: number
        currency:
          type: string
        updatedAt:
          type: string
        # Which provider actually served this row. Added 2026-09-06 with
        # the Frankfurter forex lane. That lane returns the ECB daily
        # reference fixing, not a live quote — without provenance on the
        # wire the UI cannot tell yesterday's fixing from a live Yahoo
        # tick and would render them identically. The server sets it; no
        # consumer should key behaviour off a specific value beyond
        # labelling.
        provider:
          type: ["string", "null"]
        # Change percent vs. the previous close. The server has always
        # returned this from regularMarketChangePercent, but the schema
        # omitted it — zod .parse() then stripped it on the way out,
        # so every consumer read "—" for %-change even when Yahoo had
        # a real value. Added 2026-08-16 so MarketPane on the home
        # screen and the marquee on /investments show real numbers
        # rather than fabricated or absent ones.
        changePercent:
          type: ["number", "null"]
        previousClose:
          type: ["number", "null"]
        dayHigh:
          type: ["number", "null"]
        dayLow:
          type: ["number", "null"]
        volume:
          type: ["number", "null"]
        nextEarningsDate:
          type: ["string", "null"]
        marketState:
          type: ["string", "null"]
        postMarketPrice:
          type: ["number", "null"]
        postMarketChangePercent:
          type: ["number", "null"]
        preMarketPrice:
          type: ["number", "null"]
        preMarketChangePercent:
          type: ["number", "null"]
        pe:
          type: ["number", "null"]
        forwardPe:
          type: ["number", "null"]
        eps:
          type: ["number", "null"]
        high52w:
          type: ["number", "null"]
        low52w:
          type: ["number", "null"]
        marketCap:
          type: ["number", "null"]
        beta:
          type: ["number", "null"]
        dividendYield:
          type: ["number", "null"]
        analystTargetPrice:
