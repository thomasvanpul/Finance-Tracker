    # ── SETTINGS (currency) ──────────────────────────────────────────────────
    CurrencySettings:
      type: object
      required: [baseCurrency]
      properties:
        baseCurrency:
          type: string
          enum: [GBP, USD, EUR, MYR, CNY, JPY, AUD, CAD, SGD, HKD, THB, INR]

    PersonaSettings:
      type: object
      required: [persona]
      properties:
        persona:
          type: string
          enum: [market, budget, wealth, social, full]
          description: |
            Which product face the user sees. See lib/persona.ts on the
            frontend for what each id enables/disables.

    PersonaState:
      type: object
      required: [persona, onboarded]
      properties:
        persona:
          type: string
          enum: [market, budget, wealth, social, full]
          description: |
            Which product face the user sees. See lib/persona.ts on the
            frontend for what each id enables/disables.
        onboarded:
          type: boolean
          description: |
            Whether this persona was ever actually chosen. Read-only, and
            separate from `persona` because the persona string cannot
            carry it: the column defaults to "full", so a user who has
            never answered the onboarding questions and one who
            deliberately picked "full" read back the same string. The
            client uses this to decide whether to ask.

            Not part of PersonaSettings (the PUT body) — a client cannot
            set it. It is derived from app_settings.onboarded_at, which
            setPersona stamps on the first write.

    ThemeSettings:
      type: object
      required: [theme]
      properties:
        theme:
          type: string
          enum: [void, phosphor, arctic, parchment, slate, linen, amber, midnight, matrix, synthwave, deep-space, mario, gilded, bloodline]
          description: |
            The user's chosen colour theme. Server owns this so it
            follows the user across devices and never leaks to a
            different user on the same browser. See
            contexts/theme-context.tsx for colour semantics.

    DeleteUserAccountInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The account email, typed by the user as confirmation

    DeleteUserAccountResult:
      type: object
      required: [deletedRows, tables]
      properties:
        deletedRows:
          type: integer
          description: Rows removed across every table, the user row included
        tables:
          type: object
          additionalProperties:
            type: integer
          description: Rows removed per table (request_metrics_anonymised counts rows kept with the user id removed)

    UserPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties:
            type: string
    UserPreferencesPatch:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties:
            type: [string, "null"]
    UserPreferencesPatchResult:
      type: object
      required: [updated, removed]
      properties:
        updated:
          type: integer
        removed:
          type: integer
    TabSlotSettings:
      type: object
      required: [tabSlot]
      properties:
        tabSlot:
          type: [string, "null"]
          enum: [spending, markets, upcoming, owing, watchlist, null]
          description: |
            The user-chosen third position in the phone tab bar
            (HOME · WORTH · [slot] · DIRECTORY). null means no override:
            the client shows the persona default. Server-owned so the
            choice follows the user across devices — see
            artifacts/finance-tracker/src/lib/tab-slot.ts.

    # ── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [baseCurrency, netLiquidity, netWorth, totalCash, totalLiabilities, unconvertibleAccounts, accountBreakdown, portfolio, thisMonth, owing]
      properties:
        # Count of accounts whose FX rate was unavailable at request time.
        # Their balance is NOT included in totalCash/netWorth/netLiquidity
        # (the server dropped them from the aggregation) so the UI can
        # name the gap ("2 accounts unconverted") rather than silently
        # under-report the total.
        unconvertibleAccounts:
          type: integer
        baseCurrency:
          type: string
        netLiquidity:
          type: number
        netWorth:
          type: number
        # Sum of every ASSET account converted to base — cash, investment,
        # pension, property, other. It does NOT include `liability`
        # accounts; those are reported separately in totalLiabilities so
        # the response still reconciles:
        #   netWorth = totalCash + portfolio.totalValueBase
        #            + owing.netBase - totalLiabilities
        # Netting a liability into totalCash would have broken that
        # identity silently and made a field named "Cash" fall when a
        # loan is entered.
        totalCash:
          type: number
        # Sum of `liability` accounts, converted to base, as a POSITIVE
        # number. The account balance stays positive and the type carries
        # the sign; net worth subtracts this term. A negative balance on a
        # `cash` account is an OVERDRAFT, not a liability — it stays in
        # totalCash (and in netLiquidity) as a negative contribution. The
        # two are deliberately not collapsed onto the sign.
        totalLiabilities:
          type: number
        accountBreakdown:
          type: array
          items:
            type: object
            required: [id, name, currency, balance, baseEquivalent, type]
            properties:
              id:
                type: integer
              name:
                type: string
              currency:
                type: string
              balance:
                type: number
              baseEquivalent:
                type: ["number", "null"]
              type:
                type: string
                enum: [cash, investment, pension, property, other, liability]
        portfolio:
          type: object
          required: [totalValueBase, totalPlBase, totalPlPercent, dayChangeBase, dayChangePercent]
          properties:
            totalValueBase:
              type: number
            totalPlBase:
              type: number
            # Nullable: undefined when the portfolio has no cost basis
            # (empty portfolio). Same reason as InvestmentSummary above.
            totalPlPercent:
              type: ["number", "null"]
            # Intraday delta = sum over positions of shares * (price - previousClose),
            # converted to base. NULL when ANY contributing position lacks previousClose
            # or its FX leg — a half-computed delta is a lie on the headline that
            # decides whether the market persona has a reason to open the app tomorrow.
            dayChangeBase:
              type: ["number", "null"]
            # Percent = dayChangeBase / sum(previousValueBase). Null when the delta
            # itself is null or previousValue sums to 0.
            dayChangePercent:
              type: ["number", "null"]
        thisMonth:
          type: object
          required: [income, expenses, netSavings, savingsRate]
          properties:
            income:
              type: number
            expenses:
              type: number
            netSavings:
              type: number
            # Null when monthly income is zero — see TransactionSummary.
            savingsRate:
              type: ["number", "null"]
        owing:
          type: object
          required: [totalOwedToMe, totalIOwe, netBase, pendingCount]
          properties:
            totalOwedToMe:
              type: number
            totalIOwe:
              type: number
            netBase:
              type: number
            pendingCount:
              type: integer
            # C2-4: top pending counterparties (up to 3) so the mobile
            # home CLAIMED strip can name names, not just a count.
            # Sourced from legacy debts + F4 shared-expense
            # participants where the current user is either payer or
            # linked participant and the row is still outstanding.
            topPending:
              type: array
              items:
                type: object
                required: [name, amountBase, direction]
                properties:
                  name:
                    type: string
                  amountBase:
                    type: number
                  direction:
                    type: string
                    enum: [they_owe_me, i_owe_them]
                  daysOutstanding:
                    type: number
        monthlyHistory:
          type: array
          items:
            type: object
            required: [month, income, expenses, netSavings]
            properties:
              month:
                type: string
              # income/expenses/netSavings are NULLABLE, not just optional.
              # A month with one or more unconvertible transactions (an FX
              # rate the market API couldn't supply) emits nulls rather
              # than partial or fabricated totals. Clients MUST render
              # null as "unknown / dotted / —", never as a base-currency zero — such a zero income
              # month reads as "nothing happened" when the reality is
              # "we don't know the true income because we can't convert
              # some of it". Same class of defect as the RM 4,120 → £4,120
              # bug that the dashboard's per-tx skipping used to prevent
              # for individual entries. See dashboard.monthly-fold.test.ts
              # for the exact behaviour.
              income:
                type: number
                nullable: true
              expenses:
                type: number
                nullable: true
              netSavings:
                type: number
                nullable: true
              # C2-1: per-bucket asset composition snapshot for this
              # month. Null when no snapshot exists (see nw_snapshots
              # table — populated lazily on dashboard read for the
              # current month; past months without a snapshot render
              # as an empty band in the UI, never a fabricated zero).
              composition:
                nullable: true
                type: object
                required: [cash, investment, pension, property, other]
                properties:
                  cash:
                    type: number
                  investment:
                    type: number
                  pension:
                    type: number
                  property:
                    type: number
                  other:
                    type: number

    # ── WISE ──────────────────────────────────────────────────────────────────
    WiseStatus:
      type: object
      required: [configured, connected]
      properties:
        configured:
          type: boolean
          description: Whether WISE_API_TOKEN is set in the environment
        connected:
          type: boolean
          description: Whether the token was successfully verified against the Wise API
        profileName:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    WiseSyncResult:
      type: object
      required: [synced, added, updated]
      properties:
        synced:
          type: integer
        added:
          type: integer
        updated:
          type: integer

    # ── IMPORT (CSV) ────────────────────────────────────────────────────────────
    ImportCsvInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    CsvImportResult:
      type: object
      required: [provider, added, skipped, errors]
      properties:
        provider:
          type: string
          enum: [revolut, maybank, monzo, hsbc, wise, chase]
        added:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    # ── SETTINGS (shared result shape) ───────────────────────────────────────────────
    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
