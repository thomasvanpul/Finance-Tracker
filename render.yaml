services:
  - type: web
    name: numeris-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    # Do NOT use `corepack enable` — it symlinks into /usr/bin, which is
    # read-only on Render (EROFS: unlink '/usr/bin/pnpm'). npx fetches the
    # version pinned in package.json#packageManager into a local cache
    # instead, which needs no write access outside the workspace.
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 --filter @workspace/api-server run build
    # startCommand runs node directly. It used to be
    #   npx --yes pnpm@11.12.0 --filter @workspace/api-server run start
    # which performs an npm REGISTRY RESOLUTION on every boot even with a warm
    # cache — measured at 2.0s healthy and >30s with zero stdout when the
    # registry is unreachable. That is a hard network dependency in front of
    # the process starting, and it produced the silent port-scan timeouts on
    # 2026-09-06: no application logs because the application had not run yet.
    # It also pinned pnpm 11.12.0, the broken release that Vercel refused.
    #
    # --max-old-space-size caps V8's heap. Without it V8 sizes the heap from
    # the HOST's memory, not the 512MB cgroup, so it will not collect before
    # Render kills the process.
    startCommand: node --max-old-space-size=320 artifacts/api-server/dist/index.mjs
    # /api/accounts sits behind requireAuth and returns 401, which Render reads
    # as unhealthy — the first deploy timed out that way while the server was up
    # and answering on port 10000. /api/healthz is mounted before requireAuth in
    # app.ts and returns 200 unauthenticated.
    healthCheckPath: /api/healthz
    envVars:
      # Render injects PORT itself — do not set it.
      # Render's default was Node 24.14.1, which is fine. Pinning is only
      # needed if that regresses below 20 (--env-file-if-exists).
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # --- copy these values out of Railway BEFORE the trial expires ---
      # Several cannot be reconstructed if the project suspends.
      - key: DATABASE_URL          # Neon production, with the rotated password
        sync: false
      # Comma-separated. During the numeris.page cutover this must list BOTH
      # hosts — https://numeris.page,https://financetracker.work — plus
      # capacitor://localhost for the iOS shell. CORS fails CLOSED on a
      # missing entry (403, obvious). The FIRST entry used to be special:
      # better-auth.ts took origin[0] for WebAuthn; it now takes the whole
      # list, so order no longer decides which host can use passkeys.
      # Drop financetracker.work only after DNS, OAuth redirect URIs and the
      # Resend sending domain have all moved.
      - key: ALLOWED_ORIGINS       # https://numeris.page,https://financetracker.work
        sync: false
      # NOT this service's own Render URL, despite what this comment used to
      # say. Measured 2026-09-19: /api/auth-providers reports callbackBase
      # "https://financetracker.work", i.e. the SPA origin. better-auth builds
      # every OAuth redirect_uri from it AND derives the passkey rpID from its
      # hostname, so changing this is the flag-day step: Google and GitHub
      # redirect URIs must be re-registered in the same window, and every
      # existing passkey stops working the moment the hostname changes.
      - key: API_BASE_URL          # the PUBLIC SPA origin, e.g. https://numeris.page
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Required. 32 bytes base64. Encrypts stored provider credentials; the
      # server refuses to boot without it. Losing it means every user
      # re-enters their connection credentials.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: false
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # WISE_API_TOKEN is gone — H2 moved it to a per-user encrypted credential.
      - key: WISE_ENV
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false

  # The SPA, replacing Vercel Hobby (BACKLOG I11, Thomas's call 3 Oct 11:00:
  # Render static site with an /api rewrite, free, no paid plan). Hobby has no
  # DPA and is non-commercial; Render's DPA covers every tier. Same-origin
  # /api keeps the auth cookies first-party, which is why the SPA does not
  # call numeris-api directly (Safari ITP and the iOS WebView would drop them).
  # Live at numeris.page since 5 Oct 2026 (BACKLOG I11); vercel.json, which this
  # used to mirror, is deleted. Cutover and rollback: docs/OPERATIONS.md,
  # "numeris.page cutover to Render".
  - type: web
    name: numeris-web
    runtime: static
    rootDir: .
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 --filter @workspace/finance-tracker run build
    staticPublishPath: artifacts/finance-tracker/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://numeris-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
