services:
  - type: web
    name: numeris-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    # Do NOT use `corepack enable` — it symlinks into /usr/bin, which is
    # read-only on Render (EROFS: unlink '/usr/bin/pnpm'). npx fetches the
    # version pinned in package.json#packageManager into a local cache
    # instead, which needs no write access outside the workspace.
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 --filter @workspace/api-server run build
    # startCommand runs node directly. It used to be
    #   npx --yes pnpm@11.12.0 --filter @workspace/api-server run start
    # which performs an npm REGISTRY RESOLUTION on every boot even with a warm
    # cache — measured at 2.0s healthy and >30s with zero stdout when the
    # registry is unreachable. That is a hard network dependency in front of
    # the process starting, and it produced the silent port-scan timeouts on
    # 2026-09-06: no application logs because the application had not run yet.
    # It also pinned pnpm 11.12.0, the broken release that Vercel refused.
    #
    # --max-old-space-size caps V8's heap. Without it V8 sizes the heap from
    # the HOST's memory, not the 512MB cgroup, so it will not collect before
    # Render kills the process.
    startCommand: node --max-old-space-size=320 artifacts/api-server/dist/index.mjs
    # /api/accounts sits behind requireAuth and returns 401, which Render reads
    # as unhealthy — the first deploy timed out that way while the server was up
    # and answering on port 10000. /api/healthz is mounted before requireAuth in
    # app.ts and returns 200 unauthenticated.
    healthCheckPath: /api/healthz
    envVars:
      # Render injects PORT itself — do not set it.
      # Render's default was Node 24.14.1, which is fine. Pinning is only
      # needed if that regresses below 20 (--env-file-if-exists).
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # --- copy these values out of Railway BEFORE the trial expires ---
      # Several cannot be reconstructed if the project suspends.
      - key: DATABASE_URL          # Neon production, with the rotated password
        sync: false
      - key: ALLOWED_ORIGINS       # https://financetracker.work
        sync: false
      - key: API_BASE_URL          # this service's own https URL, set after first deploy
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Required. 32 bytes base64. Encrypts stored provider credentials; the
      # server refuses to boot without it. Losing it means every user
      # re-enters their connection credentials.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: false
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # WISE_API_TOKEN is gone — H2 moved it to a per-user encrypted credential.
      - key: WISE_ENV
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
