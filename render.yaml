services:
  - type: web
    name: numeris-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/accounts
    envVars:
      # Render injects PORT itself — do not set it.
      # Pin Node explicitly. Render's default can lag behind what the code
      # needs: the api-server uses --env-file-if-exists (Node 20+) and esbuild
      # targets a modern runtime.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # --- copy these values out of Railway BEFORE the trial expires ---
      # Several cannot be reconstructed if the project suspends.
      - key: DATABASE_URL          # Neon production, with the rotated password
        sync: false
      - key: ALLOWED_ORIGINS       # https://financetracker.work
        sync: false
      - key: API_BASE_URL          # this service's own https URL, set after first deploy
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Required. 32 bytes base64. Encrypts stored provider credentials; the
      # server refuses to boot without it. Losing it means every user
      # re-enters their connection credentials.
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: false
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # WISE_API_TOKEN is gone — H2 moved it to a per-user encrypted credential.
      - key: WISE_ENV
        sync: false
      - key: ALPACA_KEY_ID
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
